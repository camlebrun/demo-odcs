apiVersion: v3.2.0
kind: DataContract
id: raw__loyalty_members__pos
name: raw__loyalty_members__pos
version: 1.0.0
status: active
domain: pos
tags: [raw, pos]
description:
  purpose: Membres du programme de fidelite enregistres en caisse, une ligne par carte fidelite, tels que exportes par le logiciel de caisse (aucune transformation metier).
  usage: Source des contrats customer (indicateurs clients omnicanaux, audiences). Ne pas exposer directement aux consommateurs metier.
  limitations: Objet `loyalty_members`. Seule table caisse avec des donnees personnelles directes (e-mail, telephone, nom, adresse). E-mail facultatif et non verifie. Le consentement marketing est celui recueilli en caisse et ne couvre pas les autres canaux. Dates en UTC.

servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la source caisse (POS).
    project: retail-data-prod
    dataset: raw_pos

team:
  name: team-pos
  description: Equipe proprietaire des contrats et de l'ingestion de la caisse.
  members:
    - username: "@org/team-pos"
      role: owner

support:
  - channel: data-pos
    tool: email
    scope: issues
    url: mailto:data-pos@retail.example
    description: Questions et incidents sur les donnees de caisse.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: loyalty_members
    driver: analytics
    description: Une ingestion complete par jour (export de fin de journee des caisses).
  - property: latency
    value: 12
    unit: h
    element: loyalty_members.updated_at
    driver: analytics
    description: Donnees disponibles au plus tard 12 heures apres la modification en caisse.
  - property: retention
    value: 3
    unit: y
    element: loyalty_members
    description: Historique conserve 3 ans.

schema:
  - name: loyalty_members
    physicalName: loyalty_members
    physicalType: table
    description: Objet `loyalty_members` - membres du programme fidelite, une ligne par carte fidelite.
    dataGranularityDescription: Une ligne par carte fidelite (un membre).
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table ne doit jamais etre vide apres une ingestion.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE email IS NOT NULL AND NOT REGEXP_CONTAINS(email, r'^[^@\s]+@[^@\s]+$')
        mustBe: 0
        dimension: accuracy
        severity: error
        description: Les e-mails renseignes ont un format valide.
    properties:
      - name: loyalty_card_id
        physicalType: STRING
        logicalType: string
        description: Identifiant de la carte fidelite (cle vers raw__tickets__pos, tickets.loyalty_card_id). Identifiant rattachable a une personne.
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true
        classification: C2
        tags: [pseudonymized]
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
            dimension: uniqueness
            severity: error
      - name: email
        physicalType: STRING
        logicalType: string
        description: Adresse e-mail saisie en caisse lors de l'adhesion. Peut etre vide. Seule source d'e-mail cote caisse.
        classification: C3
        tags: [pii]
        logicalTypeOptions:
          format: email
      - name: phone
        physicalType: STRING
        logicalType: string
        description: Numero de telephone saisi en caisse, au format fourni par le client.
        classification: C3
        tags: [pii]
      - name: last_name
        physicalType: STRING
        logicalType: string
        description: Nom de famille du membre.
        classification: C3
        tags: [pii]
      - name: first_name
        physicalType: STRING
        logicalType: string
        description: Prenom du membre.
        classification: C3
        tags: [pii]
      - name: birth_date
        physicalType: DATE
        logicalType: date
        description: Date de naissance du membre. Peut etre vide.
        classification: C3
        tags: [pii]
      - name: address_line
        physicalType: STRING
        logicalType: string
        description: Adresse postale du membre (numero et rue).
        classification: C3
        tags: [pii]
      - name: postal_code
        physicalType: STRING
        logicalType: string
        description: Code postal de l'adresse du membre.
        classification: C3
        tags: [pii]
      - name: city
        physicalType: STRING
        logicalType: string
        description: Ville de l'adresse du membre.
        classification: C3
        tags: [pii]
      - name: country_code
        physicalType: STRING
        logicalType: string
        description: Code pays ISO 3166-1 alpha-2 de l'adresse du membre (FR, BE).
        classification: C3
        tags: [pii]
        examples: [FR]
      - name: marketing_opt_in
        physicalType: BOOL
        logicalType: boolean
        description: Vrai si le membre a consenti en caisse a recevoir des communications marketing du programme fidelite.
        required: true
        classification: C1
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
      - name: marketing_opt_in_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure du dernier recueil ou changement du consentement marketing, en UTC. Vide si jamais recueilli.
        classification: C1
      - name: enrolled_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure d'adhesion au programme fidelite, en UTC.
        required: true
        classification: C1
      - name: enrollment_store_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant du magasin ou le membre a adhere (cle vers raw__stores__pos, objet stores).
        classification: C1
      - name: updated_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de derniere modification de la fiche membre, en UTC.
        required: true
        classification: C1
      - name: meta_loaded_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de chargement de la ligne dans BigQuery, en UTC (champ technique).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: Horodatage de chargement ajoute par l'ingestion.
      - name: meta_source_file
        physicalType: STRING
        logicalType: string
        description: URI du fichier de depot dont la ligne est issue (champ technique).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: URI du fichier de depot renseignee par l'ingestion.
