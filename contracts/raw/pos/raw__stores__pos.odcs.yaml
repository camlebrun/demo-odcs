apiVersion: v3.2.0
kind: DataContract
id: raw__stores__pos
name: raw__stores__pos
version: 1.0.0
status: active
domain: pos
tags: [raw, pos]
description:
  purpose: Referentiel des magasins (40 magasins en France et en Belgique), une ligne par magasin, tel que exporte par le logiciel de caisse (aucune transformation metier).
  usage: Source des contrats customer (indicateurs clients omnicanaux, audiences). Ne pas exposer directement aux consommateurs metier.
  limitations: Objet de schema `stores`. Le fuseau (timezone) de chaque magasin est la reference pour interpreter les heures locales de raw__tickets__pos et raw__ticket_lines__pos. Les magasins fermes sont conserves (closing_date renseignee). Les adresses sont celles de points de vente professionnels, pas de personnes.

servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la source caisse (POS).
    project: retail-data-prod
    dataset: raw_pos

team:
  name: team-pos
  description: Equipe proprietaire des contrats et de l'ingestion de la caisse.
  members:
    - username: "@org/team-pos"
      role: owner

support:
  - channel: data-pos
    tool: email
    scope: issues
    url: mailto:data-pos@retail.example
    description: Questions et incidents sur les donnees de caisse.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: stores
    driver: analytics
    description: Une ingestion complete par jour (export de fin de journee des caisses).
  - property: latency
    value: 12
    unit: h
    element: stores.updated_at
    driver: analytics
    description: Donnees disponibles au plus tard 12 heures apres la modification en caisse.
  - property: retention
    value: 3
    unit: y
    element: stores
    description: Historique conserve 3 ans.

schema:
  - name: stores
    physicalName: stores
    physicalType: table
    description: Objet `stores` - magasins de l'enseigne, une ligne par magasin.
    dataGranularityDescription: Une ligne par magasin.
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table ne doit jamais etre vide apres une ingestion.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE closing_date IS NOT NULL AND opening_date IS NOT NULL AND closing_date < opening_date
        mustBe: 0
        dimension: accuracy
        severity: error
        description: La date de fermeture ne precede jamais la date d'ouverture.
    customProperties:
      - property: loadStrategy
        value: full_refresh
    properties:
      - name: store_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant technique du magasin dans la caisse.
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true
        classification: C1
        examples: [12]
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
            dimension: uniqueness
            severity: error
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.store_id
        transformDescription: Recopie du champ store_id de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: store_code
        physicalType: STRING
        logicalType: string
        description: Code court du magasin utilise en exploitation.
        required: true
        unique: true
        classification: C1
        examples: ["FR-LYO-01"]
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.store_code
        transformDescription: Recopie du champ store_code de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: store_name
        physicalType: STRING
        logicalType: string
        description: Nom commercial du magasin.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.store_name
        transformDescription: Recopie du champ store_name de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: country_code
        physicalType: STRING
        logicalType: string
        description: Code pays ISO 3166-1 alpha-2 du magasin - FR ou BE.
        required: true
        classification: C1
        enum:
          - value: FR
          - value: BE
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: [FR, BE]
            mustBe: 0
            dimension: conformity
            severity: warning
            description: Detecte l'apparition d'une nouvelle valeur cote caisse.
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.country_code
        transformDescription: Recopie du champ country_code de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: address_line
        physicalType: STRING
        logicalType: string
        description: Adresse du magasin (numero et rue).
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.address_line
        transformDescription: Recopie du champ address_line de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: postal_code
        physicalType: STRING
        logicalType: string
        description: Code postal du magasin.
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.postal_code
        transformDescription: Recopie du champ postal_code de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: city
        physicalType: STRING
        logicalType: string
        description: Ville du magasin.
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.city
        transformDescription: Recopie du champ city de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: timezone
        physicalType: STRING
        logicalType: string
        description: Fuseau horaire IANA du magasin (Europe/Paris, Europe/Brussels), a utiliser pour convertir les heures locales en UTC.
        required: true
        classification: C1
        examples: [Europe/Paris]
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.timezone
        transformDescription: Recopie du champ timezone de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: currency
        physicalType: STRING
        logicalType: string
        description: Code devise ISO 4217 du magasin (EUR).
        required: true
        classification: C1
        examples: [EUR]
        logicalTypeOptions:
          minLength: 3
          maxLength: 3
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.currency
        transformDescription: Recopie du champ currency de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: opening_date
        physicalType: DATE
        logicalType: date
        description: Date d'ouverture du magasin (heure locale).
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.opening_date
        transformDescription: Recopie du champ opening_date de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: closing_date
        physicalType: DATE
        logicalType: date
        description: Date de fermeture definitive du magasin. Vide si le magasin est ouvert.
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.closing_date
        transformDescription: Recopie du champ closing_date de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: is_active
        physicalType: BOOL
        logicalType: boolean
        description: Vrai si le magasin est actif dans la caisse.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.is_active
        transformDescription: Recopie du champ is_active de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: updated_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de derniere modification de la fiche magasin, en UTC.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - pos_export#stores.updated_at
        transformDescription: Recopie du champ updated_at de l'objet stores de l'export de la caisse (POS), sans transformation.
      - name: meta_loaded_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de chargement de la ligne dans BigQuery, en UTC (champ technique).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: Horodatage de chargement de la ligne dans BigQuery, renseigne par l'ingestion (aucune source).
      - name: meta_source_file
        physicalType: STRING
        logicalType: string
        description: URI du fichier de depot dont la ligne est issue (champ technique).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: URI du fichier de depot d'origine, renseignee par l'ingestion (aucune source).
