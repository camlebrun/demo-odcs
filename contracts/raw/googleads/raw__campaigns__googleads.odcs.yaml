# Contrat raw googleads (voir docs/conventions.md).
apiVersion: v3.2.0
kind: DataContract
id: raw__campaigns__googleads
name: raw__campaigns__googleads
version: 1.0.0
status: active
domain: googleads
tags: [raw, googleads]
description:
  purpose: Campagnes Google Ads, une ligne par campagne, telles que livrees par l'export standard (type BigQuery Data Transfer) sans transformation metier.
  usage: Source des contrats customer pour les campagnes publicitaires. Les UTM et le rapprochement campagne vers canal ne sont pas dans ce raw. Ne pas exposer directement aux consommateurs metier.
  limitations: Le budget est en micros de la devise du compte (colonne currency_code), sans conversion. Les statistiques de depense sont dans raw__ad_spend__googleads. Aucun mapping vers un canal ou une attribution ici.

servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la source Google Ads.
    project: retail-data-prod
    dataset: raw_googleads

team:
  name: team-googleads
  description: Equipe proprietaire des contrats et de l'ingestion Google Ads.
  members:
    - username: "@org/team-googleads"
      role: owner

support:
  - channel: data-googleads
    tool: email
    scope: issues
    url: mailto:data-googleads@retail.example
    description: Questions et incidents sur les donnees Google Ads.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: campaigns
    driver: analytics
    description: Une ingestion par jour.
  - property: latency
    value: 6
    unit: h
    element: campaigns.campaign_id
    driver: analytics
    description: Donnees disponibles au plus tard 6 heures apres la fin de la journee de la plateforme.
  - property: retention
    value: 3
    unit: y
    element: campaigns
    description: Historique conserve 3 ans.

schema:
  - name: campaigns
    physicalName: campaigns
    physicalType: table
    description: Objet logique campaigns (reference par raw__campaigns__googleads#campaigns.<property>). campagnes Google Ads, une ligne par campagne.
    dataGranularityDescription: Une ligne par campagne (campaign_id).
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table ne doit jamais etre vide apres une ingestion.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE campaign_budget_amount_micros < 0
        mustBe: 0
        dimension: accuracy
        severity: error
        description: Aucun budget negatif.
    properties:
      - name: campaign_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant technique de la campagne dans Google Ads (campaign.id).
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true
        classification: C1
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
            dimension: uniqueness
            severity: error
        examples: [20123456789]
      - name: customer_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant du compte Google Ads (customer.id) qui porte la campagne, sans tirets.
        required: true
        classification: C1
      - name: campaign_name
        physicalType: STRING
        logicalType: string
        description: Nom de la campagne saisi dans Google Ads, tel quel.
        required: true
        classification: C1
      - name: campaign_advertising_channel_type
        physicalType: STRING
        logicalType: string
        description: Type de canal publicitaire de la campagne (SEARCH, SHOPPING, PERFORMANCE_MAX, DISPLAY, VIDEO, DEMAND_GEN, etc.).
        required: true
        classification: C1
      - name: campaign_advertising_channel_sub_type
        physicalType: STRING
        logicalType: string
        description: Sous-type du canal publicitaire (par exemple SHOPPING_SMART_ADS). Vide quand il n'y en a pas.
        classification: C1
      - name: campaign_status
        physicalType: STRING
        logicalType: string
        description: Statut de la campagne dans Google Ads.
        required: true
        classification: C1
        enum:
          - value: ENABLED
          - value: PAUSED
          - value: REMOVED
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: [ENABLED, PAUSED, REMOVED]
            mustBe: 0
            dimension: conformity
            severity: warning
            description: Detecte l'apparition d'un nouveau statut cote Google Ads.
      - name: campaign_bidding_strategy_type
        physicalType: STRING
        logicalType: string
        description: Type de strategie d'encheres (MAXIMIZE_CONVERSIONS, TARGET_ROAS, MANUAL_CPC, etc.).
        classification: C1
      - name: campaign_budget_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant du budget partage ou dedie de la campagne (campaign_budget.id).
        classification: C1
      - name: campaign_budget_amount_micros
        physicalType: INT64
        logicalType: integer
        description: Budget quotidien en micros de la devise du compte (1 000 000 micros = 1 unite de devise), tel que livre par Google Ads.
        classification: C1
      - name: currency_code
        physicalType: STRING
        logicalType: string
        description: Code devise ISO 4217 du compte Google Ads, qui s'applique au budget.
        required: true
        classification: C1
        logicalTypeOptions:
          minLength: 3
          maxLength: 3
        examples: [EUR]
      - name: campaign_start_date
        physicalType: DATE
        logicalType: date
        description: Date de debut de la campagne, dans le fuseau du compte. Vide si non renseignee.
        classification: C1
      - name: campaign_end_date
        physicalType: DATE
        logicalType: date
        description: Date de fin planifiee de la campagne, dans le fuseau du compte. Vide si la campagne n'a pas de fin.
        classification: C1
      - name: meta_loaded_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de chargement de la ligne dans BigQuery, en UTC (champ technique).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: Horodatage de chargement ajoute par l'ingestion.
      - name: meta_source_file
        physicalType: STRING
        logicalType: string
        description: URI du fichier de depot dont la ligne est issue (champ technique, y compris pour une ingestion par API).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: URI du fichier de depot renseignee par l'ingestion.
