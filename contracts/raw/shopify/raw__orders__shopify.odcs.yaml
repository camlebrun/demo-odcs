# Contrat temoin : modele des contrats raw (voir docs/conventions.md).
apiVersion: v3.2.0
kind: DataContract
id: raw__orders__shopify
name: raw__orders__shopify
version: 1.0.0
status: active
domain: shopify
tags: [raw, shopify]
description:
  purpose: Commandes du site e-commerce Shopify, une ligne par commande, telles que livrees par l'API Admin REST (aucune transformation metier).
  usage: Source des contrats customer (indicateurs clients, audiences, acquisition). Ne pas exposer directement aux consommateurs metier.
  limitations: Les montants sont dans la devise de la boutique (colonne currency), sans conversion. Les lignes de commande sont dans raw__order_lines__shopify et les remboursements dans raw__refunds__shopify. Les commandes de test (test = true) sont conservees.

servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la source Shopify.
    project: retail-data-prod
    dataset: raw_shopify

team:
  name: team-shopify
  description: Equipe proprietaire des contrats et de l'ingestion Shopify.
  members:
    - username: "@org/team-shopify"
      role: owner

support:
  - channel: data-shopify
    tool: email
    scope: issues
    url: mailto:data-shopify@retail.example
    description: Questions et incidents sur les donnees Shopify.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: orders
    driver: analytics
    description: Une ingestion complete par jour.
  - property: latency
    value: 6
    unit: h
    element: orders.updated_at
    driver: analytics
    description: Donnees disponibles au plus tard 6 heures apres la modification dans Shopify.
  - property: retention
    value: 3
    unit: y
    element: orders
    description: Historique conserve 3 ans.

schema:
  - name: orders
    physicalName: orders
    physicalType: table
    description: Commandes Shopify (objet Order de l'API Admin REST), une ligne par commande.
    dataGranularityDescription: Une ligne par commande.
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table ne doit jamais etre vide apres une ingestion.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE total_price < 0
        mustBe: 0
        dimension: accuracy
        severity: error
        description: Aucun total de commande negatif.
    customProperties:
      - property: loadStrategy
        value: full_refresh
    properties:
      - name: id
        physicalType: INT64
        logicalType: integer
        description: Identifiant technique de la commande dans Shopify.
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true
        classification: C1
        examples: [450789469]
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
            dimension: uniqueness
            severity: error
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.id
        transformDescription: Recopie du champ id de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: name
        physicalType: STRING
        logicalType: string
        description: Numero de commande affiche au client, avec prefixe (ex. #1001).
        required: true
        classification: C1
        examples: ["#1001"]
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.name
        transformDescription: Recopie du champ name de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: order_number
        physicalType: INT64
        logicalType: integer
        description: Numero de commande sequentiel sans prefixe.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.order_number
        transformDescription: Recopie du champ order_number de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: email
        physicalType: STRING
        logicalType: string
        description: Adresse e-mail saisie a la commande. Peut etre vide (commande creee en caisse Shopify ou sans e-mail).
        classification: C3
        tags: [pii]
        logicalTypeOptions:
          format: email
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.email
        transformDescription: Recopie du champ email de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: phone
        physicalType: STRING
        logicalType: string
        description: Numero de telephone saisi a la commande, au format fourni par le client.
        classification: C3
        tags: [pii]
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.phone
        transformDescription: Recopie du champ phone de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: customer_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant du client Shopify (cle vers raw__customers__shopify). Vide pour une commande invite.
        classification: C2
        tags: [pseudonymized]
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.customer_id
        transformDescription: Recopie du champ customer_id de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: created_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de creation de la commande, en UTC.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.created_at
        transformDescription: Recopie du champ created_at de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: updated_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de derniere modification de la commande, en UTC.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.updated_at
        transformDescription: Recopie du champ updated_at de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: processed_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de validation du paiement par le client, en UTC.
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.processed_at
        transformDescription: Recopie du champ processed_at de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: closed_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de cloture de la commande, en UTC. Vide tant que la commande est ouverte.
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.closed_at
        transformDescription: Recopie du champ closed_at de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: cancelled_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure d'annulation de la commande, en UTC. Vide si la commande n'est pas annulee.
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.cancelled_at
        transformDescription: Recopie du champ cancelled_at de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: cancel_reason
        physicalType: STRING
        logicalType: string
        description: Motif d'annulation fourni par Shopify (customer, fraud, inventory, declined, other). Vide si non annulee.
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.cancel_reason
        transformDescription: Recopie du champ cancel_reason de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: financial_status
        physicalType: STRING
        logicalType: string
        description: Statut de paiement de la commande.
        required: true
        classification: C1
        enum:
          - value: pending
          - value: authorized
          - value: partially_paid
          - value: paid
          - value: partially_refunded
          - value: refunded
          - value: voided
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: [pending, authorized, partially_paid, paid, partially_refunded, refunded, voided]
            mustBe: 0
            dimension: conformity
            severity: warning
            description: Detecte l'apparition d'un nouveau statut cote Shopify.
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.financial_status
        transformDescription: Recopie du champ financial_status de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: fulfillment_status
        physicalType: STRING
        logicalType: string
        description: Statut d'expedition (fulfilled, partial, restocked). Vide si rien n'a ete expedie.
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.fulfillment_status
        transformDescription: Recopie du champ fulfillment_status de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: currency
        physicalType: STRING
        logicalType: string
        description: Code devise ISO 4217 de la boutique, qui s'applique a tous les montants de la ligne.
        required: true
        classification: C1
        logicalTypeOptions:
          minLength: 3
          maxLength: 3
        examples: [EUR]
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.currency
        transformDescription: Recopie du champ currency de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: subtotal_price
        physicalType: NUMERIC
        logicalType: number
        description: Montant des articles apres remises, hors livraison, dans la devise currency.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.subtotal_price
        transformDescription: Recopie du champ subtotal_price de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: total_discounts
        physicalType: NUMERIC
        logicalType: number
        description: Somme des remises appliquees a la commande.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.total_discounts
        transformDescription: Recopie du champ total_discounts de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: total_tax
        physicalType: NUMERIC
        logicalType: number
        description: Somme des taxes de la commande.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.total_tax
        transformDescription: Recopie du champ total_tax de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: total_price
        physicalType: NUMERIC
        logicalType: number
        description: Montant total paye par le client (articles, livraison, taxes, remises), dans la devise currency.
        required: true
        classification: C1
        criticalDataElement: true
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.total_price
        transformDescription: Recopie du champ total_price de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: source_name
        physicalType: STRING
        logicalType: string
        description: Canal d'origine de la commande (web, pos, shopify_draft_order, application tierce).
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.source_name
        transformDescription: Recopie du champ source_name de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: test
        physicalType: BOOL
        logicalType: boolean
        description: Vrai pour une commande de test, a exclure des analyses.
        required: true
        classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.test
        transformDescription: Recopie du champ test de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: discount_codes
        physicalType: ARRAY<STRUCT<code STRING, amount NUMERIC, type STRING>>
        logicalType: array
        description: Codes de reduction utilises sur la commande.
        classification: C1
        items:
          logicalType: object
          physicalType: STRUCT<code STRING, amount NUMERIC, type STRING>
          properties:
            - name: code
              physicalType: STRING
              logicalType: string
              description: Code de reduction saisi par le client.
              classification: C1
            - name: amount
              physicalType: NUMERIC
              logicalType: number
              description: Montant de la remise liee au code, dans la devise currency.
              classification: C1
            - name: type
              physicalType: STRING
              logicalType: string
              description: Type de remise (fixed_amount, percentage, shipping).
              classification: C1
        transformLogic: map
        transformSourceObjects:
          - shopify_admin_api#Order.discount_codes
        transformDescription: Recopie du champ discount_codes de l'objet Order de l'API Admin Shopify, sans transformation.
      - name: meta_loaded_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de chargement de la ligne dans BigQuery, en UTC (champ technique).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: Horodatage de chargement de la ligne dans BigQuery, renseigne par l'ingestion (aucune source).
      - name: meta_source_file
        physicalType: STRING
        logicalType: string
        description: URI du fichier de depot dont la ligne est issue (champ technique).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: URI du fichier de depot d'origine, renseignee par l'ingestion (aucune source).
