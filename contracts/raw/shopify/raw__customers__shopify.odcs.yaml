# Objet de schema : customers. Cles : customers.id (PII, pseudonymise), customers.email (PII), customers.phone (PII), customers.accepts_marketing, customers.default_address.*.
apiVersion: v3.2.0
kind: DataContract
id: raw__customers__shopify
name: raw__customers__shopify
version: 1.0.0
status: active
domain: shopify
tags:
- raw
- shopify
description:
  purpose: Clients du site e-commerce Shopify (objet de schema customers), une ligne par compte client, tels que livres par l'API Admin REST (aucune transformation metier).
  usage: 'Source des contrats customer (identite, consentement marketing, adresse). Contient des donnees personnelles directes : acces restreint, ne pas exposer directement aux consommateurs metier.'
  limitations: Les commandes passees en invite n'ont pas de client (orders.customer_id vide) et n'apparaissent pas ici. Les agregats (orders_count, total_spent) sont ceux de Shopify, non recalcules. Les clients du magasin physique et du POS ne sont pas inclus. accepts_marketing ne couvre que le consentement Shopify.
servers:
- server: bigquery_prod
  type: bigquery
  environment: prod
  description: Dataset BigQuery de la source Shopify.
  project: retail-data-prod
  dataset: raw_shopify
team:
  name: team-shopify
  description: Equipe proprietaire des contrats et de l'ingestion Shopify.
  members:
  - username: '@org/team-shopify'
    role: owner
support:
- channel: data-shopify
  tool: email
  scope: issues
  url: mailto:data-shopify@retail.example
  description: Questions et incidents sur les donnees Shopify.
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: customers
  driver: analytics
  description: Une ingestion complete par jour.
- property: latency
  value: 6
  unit: h
  element: customers.updated_at
  driver: analytics
  description: Donnees disponibles au plus tard 6 heures apres la modification dans Shopify.
- property: retention
  value: 3
  unit: y
  element: customers
  description: Historique conserve 3 ans.
schema:
- name: customers
  physicalName: customers
  physicalType: table
  description: Clients Shopify (objet Customer de l'API Admin REST), une ligne par compte client. Les commandes invite n'y figurent pas.
  dataGranularityDescription: Une ligne par client.
  quality:
  - type: library
    metric: rowCount
    mustBeGreaterThan: 0
    dimension: completeness
    severity: error
    description: La table ne doit jamais etre vide apres une ingestion.
  properties:
  - name: id
    physicalType: INT64
    logicalType: integer
    description: Identifiant technique du client dans Shopify (identifiant personnel pseudonymise, cle vers raw__orders__shopify#orders.customer_id).
    required: true
    classification: C2
    unique: true
    primaryKey: true
    primaryKeyPosition: 1
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
      dimension: uniqueness
      severity: error
    tags:
    - pseudonymized
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.id
    transformDescription: Recopie du champ id de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: email
    physicalType: STRING
    logicalType: string
    description: Adresse e-mail du client. Peut etre vide (client cree sans e-mail, par exemple en caisse).
    classification: C3
    logicalTypeOptions:
      format: email
    tags:
    - pii
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.email
    transformDescription: Recopie du champ email de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: phone
    physicalType: STRING
    logicalType: string
    description: Numero de telephone du client, au format fourni par le client.
    classification: C3
    tags:
    - pii
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.phone
    transformDescription: Recopie du champ phone de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: first_name
    physicalType: STRING
    logicalType: string
    description: Prenom du client.
    classification: C3
    tags:
    - pii
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.first_name
    transformDescription: Recopie du champ first_name de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: last_name
    physicalType: STRING
    logicalType: string
    description: Nom de famille du client.
    classification: C3
    tags:
    - pii
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.last_name
    transformDescription: Recopie du champ last_name de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: created_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Date et heure de creation du compte client, en UTC.
    required: true
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.created_at
    transformDescription: Recopie du champ created_at de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: updated_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Date et heure de derniere modification du client, en UTC.
    required: true
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.updated_at
    transformDescription: Recopie du champ updated_at de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: state
    physicalType: STRING
    logicalType: string
    description: Etat du compte client (disabled, invited, enabled, declined).
    required: true
    classification: C1
    enum:
    - value: disabled
    - value: invited
    - value: enabled
    - value: declined
    quality:
    - type: library
      metric: invalidValues
      arguments:
        validValues:
        - disabled
        - invited
        - enabled
        - declined
      mustBe: 0
      dimension: conformity
      severity: warning
      description: Detecte l'apparition d'un nouvel etat cote Shopify.
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.state
    transformDescription: Recopie du champ state de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: accepts_marketing
    physicalType: BOOL
    logicalType: boolean
    description: Vrai si le client a accepte de recevoir des communications marketing par e-mail (consentement declare dans Shopify).
    required: true
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.accepts_marketing
    transformDescription: Recopie du champ accepts_marketing de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: accepts_marketing_updated_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Date et heure de derniere modification du consentement marketing, en UTC.
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.accepts_marketing_updated_at
    transformDescription: Recopie du champ accepts_marketing_updated_at de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: marketing_opt_in_level
    physicalType: STRING
    logicalType: string
    description: Niveau de consentement marketing (single_opt_in, confirmed_opt_in, unknown).
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.marketing_opt_in_level
    transformDescription: Recopie du champ marketing_opt_in_level de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: verified_email
    physicalType: BOOL
    logicalType: boolean
    description: Vrai si l'adresse e-mail a ete verifiee.
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.verified_email
    transformDescription: Recopie du champ verified_email de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: tax_exempt
    physicalType: BOOL
    logicalType: boolean
    description: Vrai si le client est exonere de taxe.
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.tax_exempt
    transformDescription: Recopie du champ tax_exempt de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: currency
    physicalType: STRING
    logicalType: string
    description: Code devise ISO 4217 de la derniere commande du client.
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.currency
    transformDescription: Recopie du champ currency de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: orders_count
    physicalType: INT64
    logicalType: integer
    description: Nombre de commandes du client selon Shopify a la date d'extraction.
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.orders_count
    transformDescription: Recopie du champ orders_count de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: total_spent
    physicalType: NUMERIC
    logicalType: number
    description: Montant cumule depense par le client selon Shopify, dans la devise currency. Indicatif, non recalcule.
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.total_spent
    transformDescription: Recopie du champ total_spent de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: last_order_id
    physicalType: INT64
    logicalType: integer
    description: Identifiant de la derniere commande du client (cle vers raw__orders__shopify#orders.id).
    classification: C2
    tags:
    - pseudonymized
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.last_order_id
    transformDescription: Recopie du champ last_order_id de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: tags
    physicalType: STRING
    logicalType: string
    description: Etiquettes libres attachees au client, separees par des virgules.
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.tags
    transformDescription: Recopie du champ tags de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: note
    physicalType: STRING
    logicalType: string
    description: Note libre sur le client, susceptible de contenir des donnees personnelles.
    classification: C3
    tags:
    - pii
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.note
    transformDescription: Recopie du champ note de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: default_address
    physicalType: STRUCT<id INT64, name STRING, company STRING, address1 STRING, address2 STRING, zip STRING, city STRING, province STRING, country STRING, country_code STRING, phone STRING>
    logicalType: object
    description: Adresse par defaut du client (donnees personnelles directes).
    classification: C3
    properties:
    - name: id
      physicalType: INT64
      logicalType: integer
      description: Identifiant de l'adresse dans Shopify.
      classification: C2
      tags:
      - pseudonymized
    - name: name
      physicalType: STRING
      logicalType: string
      description: Nom complet du destinataire de l'adresse.
      classification: C3
      tags:
      - pii
    - name: company
      physicalType: STRING
      logicalType: string
      description: Societe du destinataire.
      classification: C3
      tags:
      - pii
    - name: address1
      physicalType: STRING
      logicalType: string
      description: Premiere ligne de l'adresse (numero et rue).
      classification: C3
      tags:
      - pii
    - name: address2
      physicalType: STRING
      logicalType: string
      description: Complement d'adresse.
      classification: C3
      tags:
      - pii
    - name: zip
      physicalType: STRING
      logicalType: string
      description: Code postal.
      classification: C3
      tags:
      - pii
    - name: city
      physicalType: STRING
      logicalType: string
      description: Ville.
      classification: C3
      tags:
      - pii
    - name: province
      physicalType: STRING
      logicalType: string
      description: Region ou province.
      classification: C3
      tags:
      - pii
    - name: country
      physicalType: STRING
      logicalType: string
      description: Nom du pays.
      classification: C3
      tags:
      - pii
    - name: country_code
      physicalType: STRING
      logicalType: string
      description: Code pays ISO 3166-1 alpha-2 (FR, BE).
      classification: C3
      tags:
      - pii
    - name: phone
      physicalType: STRING
      logicalType: string
      description: Telephone associe a l'adresse.
      classification: C3
      tags:
      - pii
    tags:
    - pii
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Customer.default_address
    transformDescription: Recopie du champ default_address de l'objet Customer de l'API Admin Shopify, sans transformation.
  - name: meta_loaded_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Date et heure de chargement de la ligne dans BigQuery, en UTC (champ technique).
    required: true
    classification: C1
    transformLogic: create
    transformDescription: Horodatage de chargement de la ligne dans BigQuery, renseigne par l'ingestion (aucune source).
  - name: meta_source_file
    physicalType: STRING
    logicalType: string
    description: URI du fichier de depot dont la ligne est issue (champ technique).
    required: true
    classification: C1
    transformLogic: create
    transformDescription: URI du fichier de depot d'origine, renseignee par l'ingestion (aucune source).
