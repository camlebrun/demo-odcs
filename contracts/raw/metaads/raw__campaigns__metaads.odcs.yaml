# Contrat raw metaads (voir docs/conventions.md).
apiVersion: v3.2.0
kind: DataContract
id: raw__campaigns__metaads
name: raw__campaigns__metaads
version: 1.0.0
status: active
domain: metaads
tags: [raw, metaads]
description:
  purpose: Campagnes Meta Ads (Facebook et Instagram), une ligne par campagne, telles que livrees par l'API Marketing sans transformation metier.
  usage: Source des contrats customer pour les campagnes publicitaires. Les UTM et le rapprochement campagne vers canal ne sont pas dans ce raw. Ne pas exposer directement aux consommateurs metier.
  limitations: Les budgets sont en unite mineure de la devise du compte publicitaire, sans conversion ; la devise figure dans raw__ad_spend__metaads (account_currency). Les statistiques de depense sont dans raw__ad_spend__metaads. Aucun mapping vers un canal ou une attribution ici.

servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la source Meta Ads.
    project: retail-data-prod
    dataset: raw_metaads

team:
  name: team-metaads
  description: Equipe proprietaire des contrats et de l'ingestion Meta Ads.
  members:
    - username: "@org/team-metaads"
      role: owner

support:
  - channel: data-metaads
    tool: email
    scope: issues
    url: mailto:data-metaads@retail.example
    description: Questions et incidents sur les donnees Meta Ads.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: campaigns
    driver: analytics
    description: Une ingestion par jour.
  - property: latency
    value: 6
    unit: h
    element: campaigns.updated_time
    driver: analytics
    description: Donnees disponibles au plus tard 6 heures apres la fin de la journee de la plateforme.
  - property: retention
    value: 3
    unit: y
    element: campaigns
    description: Historique conserve 3 ans.

schema:
  - name: campaigns
    physicalName: campaigns
    physicalType: table
    description: Objet logique campaigns (reference par raw__campaigns__metaads#campaigns.<property>). campagnes Meta Ads, une ligne par campagne.
    dataGranularityDescription: Une ligne par campagne (campaign_id).
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table ne doit jamais etre vide apres une ingestion.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE daily_budget < 0 OR lifetime_budget < 0
        mustBe: 0
        dimension: accuracy
        severity: error
        description: Aucun budget negatif.
    properties:
      - name: campaign_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant technique de la campagne dans Meta Ads (champ id de l'API Marketing).
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true
        classification: C1
        quality:
          - type: library
            metric: duplicateValues
            mustBe: 0
            dimension: uniqueness
            severity: error
      - name: ad_account_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant du compte publicitaire Meta, sans le prefixe act_.
        required: true
        classification: C1
      - name: name
        physicalType: STRING
        logicalType: string
        description: Nom de la campagne saisi dans Meta Ads, tel quel.
        required: true
        classification: C1
      - name: objective
        physicalType: STRING
        logicalType: string
        description: Objectif de la campagne (OUTCOME_SALES, OUTCOME_TRAFFIC, OUTCOME_AWARENESS, OUTCOME_LEADS, etc.).
        classification: C1
      - name: buying_type
        physicalType: STRING
        logicalType: string
        description: Mode d'achat (AUCTION ou RESERVED).
        classification: C1
      - name: status
        physicalType: STRING
        logicalType: string
        description: Statut configure de la campagne.
        required: true
        classification: C1
        enum:
          - value: ACTIVE
          - value: PAUSED
          - value: DELETED
          - value: ARCHIVED
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: [ACTIVE, PAUSED, DELETED, ARCHIVED]
            mustBe: 0
            dimension: conformity
            severity: warning
            description: Detecte l'apparition d'un nouveau statut cote Meta.
      - name: effective_status
        physicalType: STRING
        logicalType: string
        description: Statut effectif de diffusion (ACTIVE, PAUSED, CAMPAIGN_PAUSED, WITH_ISSUES, etc.), tenant compte du compte et des ensembles de publicites.
        classification: C1
      - name: daily_budget
        physicalType: INT64
        logicalType: integer
        description: Budget quotidien au niveau campagne, en unite mineure de la devise du compte (centimes pour l'EUR). Vide si le budget est defini au niveau des ensembles de publicites.
        classification: C1
      - name: lifetime_budget
        physicalType: INT64
        logicalType: integer
        description: Budget total sur la duree de la campagne, en unite mineure de la devise du compte. Vide si un budget quotidien est utilise.
        classification: C1
      - name: start_time
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de debut de la campagne, en UTC. Vide si non renseignee.
        classification: C1
      - name: stop_time
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de fin planifiee de la campagne, en UTC. Vide si pas de fin.
        classification: C1
      - name: created_time
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de creation de la campagne dans Meta Ads, en UTC.
        required: true
        classification: C1
      - name: updated_time
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de derniere modification de la campagne, en UTC.
        required: true
        classification: C1
      - name: meta_loaded_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de chargement de la ligne dans BigQuery, en UTC (champ technique).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: Horodatage de chargement ajoute par l'ingestion.
      - name: meta_source_file
        physicalType: STRING
        logicalType: string
        description: URI du fichier de depot dont la ligne est issue (champ technique, y compris pour une ingestion par API).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: URI du fichier de depot renseignee par l'ingestion.
