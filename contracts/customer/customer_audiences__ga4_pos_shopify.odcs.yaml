# Contrat customer : audiences marketing quotidiennes (clients consentants). Voir docs/use-cases/customer_audiences__ga4_pos_shopify.md.
apiVersion: v3.2.0
kind: DataContract
id: customer_audiences__ga4_pos_shopify
name: customer_audiences__ga4_pos_shopify
version: 1.0.0
status: active
domain: customer
tags: [customer]
description:
  purpose: Listes d'audiences marketing a activer (exclusion acquisition, reactivation, retargeting, graine lookalike), uniquement pour des clients ayant consenti. Une ligne par client (customer_key) et par segment ; un client peut appartenir a plusieurs segments.
  usage: Alimente Google Customer Match et Meta Custom Audiences (sponsor CRM / marketing) chaque jour. Segments - buyers_90d (achat dans les 90 derniers jours, a exclure de l'acquisition), inactive_12m (aucun achat depuis plus de 12 mois, reactivation), product_viewers_no_purchase (consultation d'une fiche produit dans les 14 derniers jours sans achat depuis, retargeting), top_customers (10 % des clients au CA net 12 mois le plus eleve parmi ceux ayant au moins 2 achats sur 12 mois, graine lookalike). La table est un instantane recalcule chaque jour (audience_date). Seul le hash customer_key est expose, jamais l'e-mail en clair (minimisation).
  limitations: |-
    Limites assumees du lot 1.
    (1) Identite client deterministe : customer_key = SHA256(LOWER(TRIM(email))), sans rapprochement flou. Les tickets sans carte fidelite sont anonymes (environ 50 % des tickets) : ils n'alimentent aucune audience, car sans e-mail aucune activation n'est possible. Cote caisse l'e-mail vient de raw__loyalty_members__pos via loyalty_card_id ; cote Shopify de orders puis customers.
    (2) Consentement = accepts_marketing Shopify + opt-in fidelite en caisse (marketing_opt_in), pas de CRM ni d'ESP. Le signal le plus recent (horodate) l'emporte : un retrait plus recent que l'opt-in exclut le client. Sans signal de consentement connu, le client est exclu (cas des commandes invite Shopify, dont le consentement n'est pas dans orders). Le consentement porte sur des communications par e-mail ; son usage pour le ciblage publicitaire est une decision juridique du proprietaire.
    (3) Lien GA4 vers client : GA4 ne contient aucun e-mail. Un visiteur n'est rattache a un client que (a) s'il a deja achete sur le web, par le pont ecommerce.transaction_id (identifiant de commande Shopify, rapproche de orders.id ou orders.name, avec ou sans # ) puis le user_pseudo_id de l'achat, ou (b) s'il s'est connecte, via user_id suppose egal a l'identifiant client Shopify (hypothese a confirmer par team-ga4). Les visiteurs anonymes, sans consentement analytics ou sans cookie ne sont pas rattachables : product_viewers_no_purchase est donc un sous-ensemble minoritaire des vrais visiteurs de fiches produit.
    (4) Montants en EUR TTC (caisse en centimes convertis, Shopify decimal) et dates en UTC ; seules les lignes EUR sont retenues. Les retours (caisse, retours en magasin d'achats web, remboursements Shopify) sont deduits du CA net 12 mois.
    (5) Les plateformes de diffusion appliquent leur propre normalisation d'e-mail (par exemple Google pour les adresses Gmail) ; la regle du depot n'en ajoute aucune, ce qui peut reduire le taux de correspondance.
    (6) Aucune suppression automatique des clients ayant retire leur consentement chez les plateformes : la table ne liste que les consentants du jour, la resynchronisation complete des audiences est a la charge de l'activation.

servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la couche customer.
    project: retail-data-prod
    dataset: customer

team:
  name: team-customer
  description: Equipe proprietaire des contrats et des produits de donnees customer.
  members:
    - username: "@org/team-customer"
      role: owner

support:
  - channel: data-customer
    tool: email
    scope: issues
    url: mailto:data-customer@retail.example
    description: Questions et incidents sur les audiences marketing.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: customer_audiences
    driver: analytics
    description: Un recalcul complet par jour.
  - property: latency
    value: 1
    unit: d
    element: customer_audiences.audience_date
    driver: analytics
    description: Audiences du jour J disponibles au plus tard a J+1 matin, en tenant compte des latences des raw (caisse 12 h, Shopify 6 h).
  - property: retention
    value: 30
    unit: d
    element: customer_audiences
    description: Instantanes quotidiens conserves 30 jours (minimisation des donnees personnelles).

customProperties:
  - property: consumers
    value: Google Customer Match, Meta Custom Audiences
  - property: sponsor
    value: CRM / marketing
  - property: segments
    value: buyers_90d, inactive_12m, product_viewers_no_purchase, top_customers
  - property: transformInputs
    value: |-
      -- Ensemble intermediaire sur lequel portent les transformExpression des champs de cette table.
      -- Colonnes de customer_stats : customer_key, email (une adresse du client), last_order_at, orders_count_12m, net_revenue_12m_amount.
      -- Colonnes de consent : customer_key, latest (STRUCT is_opted_in, signal_at, source). Colonnes de product_views : customer_key, email, last_product_view_at.
      -- Colonnes de events : event_type (sale | return), event_at (TIMESTAMP UTC), order_id, amount_eur (negatif pour un retour), email.
      WITH web_orders AS (
        SELECT o.id, o.name, o.created_at, o.total_price,
               COALESCE(NULLIF(TRIM(o.email), ''), c.email) AS email
        FROM raw_shopify.orders o
        LEFT JOIN raw_shopify.customers c ON c.id = o.customer_id
        WHERE o.test = FALSE AND o.cancelled_at IS NULL AND o.currency = 'EUR'
          AND COALESCE(o.source_name, 'web') != 'pos'
          AND o.financial_status IN ('paid', 'partially_paid', 'partially_refunded', 'refunded')
      ),
      events AS (
        SELECT TIMESTAMP(t.ticket_datetime_local, s.timezone) AS event_at, t.ticket_type AS event_type,
               CONCAT('pos:', CAST(t.ticket_id AS STRING)) AS order_id, t.total_amount_cents / 100 AS amount_eur,
               COALESCE(NULLIF(TRIM(lm.email), ''), wo.email) AS email
        FROM raw_pos.tickets t
        JOIN raw_pos.stores s ON s.store_id = t.store_id
        LEFT JOIN raw_pos.loyalty_members lm ON lm.loyalty_card_id = t.loyalty_card_id
        LEFT JOIN web_orders wo ON wo.id = t.original_web_order_id
        WHERE t.currency = 'EUR'
          AND NOT (t.original_web_order_id IS NOT NULL
                   AND EXISTS (SELECT 1 FROM raw_shopify.refunds r WHERE r.order_id = t.original_web_order_id))
        UNION ALL
        SELECT wo.created_at, 'sale', CONCAT('web:', CAST(wo.id AS STRING)), wo.total_price, wo.email FROM web_orders wo
        UNION ALL
        SELECT r.created_at, 'return', CONCAT('refund:', CAST(r.id AS STRING)),
               -(SELECT IFNULL(SUM(tr.amount), 0) FROM UNNEST(r.transactions) tr
                 WHERE tr.kind = 'refund' AND tr.status = 'success' AND tr.currency = 'EUR'),
               wo.email
        FROM raw_shopify.refunds r JOIN web_orders wo ON wo.id = r.order_id
      ),
      customer_stats AS (
        SELECT IF(NULLIF(TRIM(email), '') IS NULL, NULL, TO_HEX(SHA256(LOWER(TRIM(email))))) AS customer_key,
               ANY_VALUE(email) AS email,
               MAX(IF(event_type = 'sale', event_at, NULL)) AS last_order_at,
               COUNT(DISTINCT IF(event_type = 'sale' AND event_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 365 DAY), order_id, NULL)) AS orders_count_12m,
               SUM(IF(event_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 365 DAY), amount_eur, 0)) AS net_revenue_12m_amount
        FROM events WHERE NULLIF(TRIM(email), '') IS NOT NULL GROUP BY customer_key
      ),
      consent AS (
        SELECT customer_key, ARRAY_AGG(STRUCT(is_opted_in, signal_at, source) ORDER BY signal_at DESC NULLS LAST LIMIT 1)[OFFSET(0)] AS latest
        FROM (
          SELECT IF(NULLIF(TRIM(c.email), '') IS NULL, NULL, TO_HEX(SHA256(LOWER(TRIM(c.email))))) AS customer_key,
                 c.accepts_marketing AS is_opted_in, c.accepts_marketing_updated_at AS signal_at, 'shopify' AS source
          FROM raw_shopify.customers c
          UNION ALL
          SELECT IF(NULLIF(TRIM(lm.email), '') IS NULL, NULL, TO_HEX(SHA256(LOWER(TRIM(lm.email))))),
                 lm.marketing_opt_in, lm.marketing_opt_in_at, 'pos'
          FROM raw_pos.loyalty_members lm
        ) WHERE customer_key IS NOT NULL AND is_opted_in IS NOT NULL
        GROUP BY customer_key
      ),
      ga_identity AS (
        SELECT p.user_pseudo_id, wo.email
        FROM raw_ga4.`events_*` p
        JOIN web_orders wo ON p.ecommerce.transaction_id IN (CAST(wo.id AS STRING), wo.name, LTRIM(wo.name, '#'))
        WHERE p.event_name = 'purchase' AND p.user_pseudo_id IS NOT NULL
        UNION ALL
        SELECT v.user_pseudo_id, c.email
        FROM raw_ga4.`events_*` v
        JOIN raw_shopify.customers c ON v.user_id = CAST(c.id AS STRING)
        WHERE v.user_id IS NOT NULL AND v.user_pseudo_id IS NOT NULL
      ),
      product_views AS (
        SELECT IF(NULLIF(TRIM(i.email), '') IS NULL, NULL, TO_HEX(SHA256(LOWER(TRIM(i.email))))) AS customer_key,
               ANY_VALUE(i.email) AS email,
               MAX(TIMESTAMP_MICROS(v.event_timestamp)) AS last_product_view_at
        FROM raw_ga4.`events_*` v
        JOIN ga_identity i ON i.user_pseudo_id = v.user_pseudo_id
        WHERE v.event_name = 'view_item' AND v.privacy_info.analytics_storage = 'Yes'
          AND TIMESTAMP_MICROS(v.event_timestamp) >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 14 DAY)
        GROUP BY customer_key
      ),
      segments AS (
        SELECT 'buyers_90d' AS segment_name, s.*, CAST(NULL AS TIMESTAMP) AS last_product_view_at FROM customer_stats s
        WHERE s.last_order_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)
        UNION ALL
        SELECT 'inactive_12m', s.*, NULL FROM customer_stats s
        WHERE s.last_order_at < TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 365 DAY)
        UNION ALL
        SELECT 'top_customers', r.customer_key, r.email, r.last_order_at, r.orders_count_12m, r.net_revenue_12m_amount, NULL
        FROM (SELECT s.*, PERCENT_RANK() OVER (ORDER BY s.net_revenue_12m_amount) AS pct_rank
              FROM customer_stats s WHERE s.orders_count_12m >= 2) r
        WHERE r.pct_rank >= 0.9
        UNION ALL
        SELECT 'product_viewers_no_purchase', pv.customer_key, pv.email, s.last_order_at, IFNULL(s.orders_count_12m, 0),
               IFNULL(s.net_revenue_12m_amount, 0), pv.last_product_view_at
        FROM product_views pv LEFT JOIN customer_stats s USING (customer_key)
        WHERE s.last_order_at IS NULL OR s.last_order_at < pv.last_product_view_at
      )
      -- Table finale : SELECT <champs> FROM segments JOIN consent USING (customer_key) WHERE consent.latest.is_opted_in

schema:
  - name: customer_audiences
    physicalName: customer_audiences
    physicalType: table
    description: Audiences marketing, une ligne par client consentant (customer_key) et par segment, recalculee chaque jour.
    dataGranularityDescription: Une ligne par client x segment (instantane du jour audience_date).
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table ne doit jamais etre vide apres un calcul.
      - type: sql
        query: SELECT COUNT(*) FROM (SELECT customer_key, segment_name FROM ${table} GROUP BY customer_key, segment_name HAVING COUNT(*) > 1)
        mustBe: 0
        dimension: uniqueness
        severity: error
        description: La cle composite du grain (customer_key, segment_name) est unique.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE is_marketing_consented IS NOT TRUE
        mustBe: 0
        dimension: conformity
        severity: error
        description: Regle de consentement - la table ne contient que des clients ayant consenti, aucune ligne sans consentement actif.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE segment_name = 'buyers_90d' AND last_order_at < TIMESTAMP_SUB(meta_computed_at, INTERVAL 90 DAY)
        mustBe: 0
        dimension: accuracy
        severity: error
        description: Un acheteur du segment buyers_90d a un dernier achat de moins de 90 jours.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE segment_name = 'product_viewers_no_purchase' AND last_product_view_at IS NULL
        mustBe: 0
        dimension: completeness
        severity: error
        description: Un client du segment product_viewers_no_purchase a une date de derniere consultation de fiche produit.
    properties:
      - name: customer_key
        physicalType: STRING
        logicalType: string
        description: Cle client pseudonymisee, SHA-256 hexadecimal en minuscules (64 caracteres) de l'e-mail normalise (minuscules, espaces retires). Valeur a charger telle quelle dans les audiences Customer Match et Custom Audiences. Reste une donnee personnelle au sens du RGPD.
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        classification: confidential
        tags: [pseudonymized]
        logicalTypeOptions:
          minLength: 64
          maxLength: 64
        transformLogic: transform
        transformSourceObjects:
          - raw__loyalty_members__pos#loyalty_members.email
          - raw__customers__shopify#customers.email
          - raw__orders__shopify#orders.email
        transformDescription: Hash SHA-256 de l'e-mail normalise, l'e-mail provenant de la fiche fidelite caisse, du client Shopify ou de la commande Shopify.
        customProperties:
          - property: transformExpression
            value: IF(NULLIF(TRIM(email), '') IS NULL, NULL, TO_HEX(SHA256(LOWER(TRIM(email)))))
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
      - name: segment_name
        physicalType: STRING
        logicalType: string
        description: Nom du segment d'audience - buyers_90d (exclusion acquisition), inactive_12m (reactivation), product_viewers_no_purchase (retargeting), top_customers (graine lookalike). Partie de la cle.
        primaryKey: true
        primaryKeyPosition: 2
        required: true
        classification: internal
        enum:
          - value: buyers_90d
          - value: inactive_12m
          - value: product_viewers_no_purchase
          - value: top_customers
        transformLogic: create
        transformDescription: Constante propre a chaque branche de l'union des quatre segments, sans colonne source.
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: [buyers_90d, inactive_12m, product_viewers_no_purchase, top_customers]
            mustBe: 0
            dimension: conformity
            severity: error
      - name: audience_date
        physicalType: DATE
        logicalType: date
        description: Date de calcul de l'instantane (Europe/Paris). Les audiences a activer sont celles de la date la plus recente.
        required: true
        classification: internal
        transformLogic: create
        transformDescription: Date du jour de calcul dans le fuseau Europe/Paris.
        customProperties:
          - property: transformExpression
            value: CURRENT_DATE('Europe/Paris')
      - name: is_marketing_consented
        physicalType: BOOL
        logicalType: boolean
        description: Vrai si le signal de consentement marketing le plus recent du client (Shopify accepts_marketing ou opt-in fidelite en caisse) est un consentement. Toujours vrai dans cette table, qui ne contient que des consentants.
        required: true
        classification: confidential
        transformLogic: transform
        transformSourceObjects:
          - raw__customers__shopify#customers.accepts_marketing
          - raw__customers__shopify#customers.accepts_marketing_updated_at
          - raw__loyalty_members__pos#loyalty_members.marketing_opt_in
          - raw__loyalty_members__pos#loyalty_members.marketing_opt_in_at
        transformDescription: Valeur du consentement dans le signal le plus recent parmi Shopify et la caisse.
        customProperties:
          - property: transformExpression
            value: latest.is_opted_in
      - name: consent_source
        physicalType: STRING
        logicalType: string
        description: Source du signal de consentement retenu - shopify (accepts_marketing) ou pos (opt-in fidelite en caisse).
        required: true
        classification: internal
        enum:
          - value: shopify
          - value: pos
        transformLogic: transform
        transformSourceObjects:
          - raw__customers__shopify#customers.accepts_marketing
          - raw__loyalty_members__pos#loyalty_members.marketing_opt_in
        transformDescription: Source (Shopify ou caisse) du signal de consentement le plus recent.
        customProperties:
          - property: transformExpression
            value: latest.source
      - name: consent_updated_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure du signal de consentement retenu, en UTC. Peut etre vide si la source n'a pas horodate le consentement.
        classification: internal
        transformLogic: transform
        transformSourceObjects:
          - raw__customers__shopify#customers.accepts_marketing_updated_at
          - raw__loyalty_members__pos#loyalty_members.marketing_opt_in_at
        transformDescription: Horodatage du signal de consentement le plus recent.
        customProperties:
          - property: transformExpression
            value: latest.signal_at
      - name: last_order_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de la derniere vente du client, tous canaux, en UTC (heure de caisse convertie avec le fuseau du magasin). Vide pour un client qui n'a jamais achete.
        classification: internal
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__tickets__pos#tickets.ticket_type
          - raw__stores__pos#stores.timezone
          - raw__orders__shopify#orders.created_at
        transformDescription: Plus recente date de vente parmi les tickets de caisse (convertis en UTC) et les commandes Shopify du client.
        customProperties:
          - property: transformExpression
            value: MAX(IF(event_type = 'sale', event_at, NULL))
      - name: orders_count_12m
        physicalType: INT64
        logicalType: integer
        description: Nombre de ventes du client sur les 365 derniers jours, tous canaux.
        required: true
        classification: internal
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__stores__pos#stores.timezone
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.created_at
        transformDescription: Comptage des tickets de vente et des commandes Shopify du client sur 365 jours.
        customProperties:
          - property: transformExpression
            value: COUNT(DISTINCT IF(event_type = 'sale' AND event_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 365 DAY), order_id, NULL))
      - name: net_revenue_12m_amount
        physicalType: NUMERIC
        logicalType: number
        description: CA net de retours du client sur les 365 derniers jours, en EUR TTC, tous canaux. Sert au classement du segment top_customers.
        required: true
        classification: confidential
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.total_amount_cents
          - raw__orders__shopify#orders.total_price
          - raw__refunds__shopify#refunds.transactions.amount
          - raw__refunds__shopify#refunds.transactions.kind
          - raw__refunds__shopify#refunds.transactions.status
        transformDescription: Somme des ventes et retours du client sur 365 jours, centimes de la caisse divises par 100.
        customProperties:
          - property: transformExpression
            value: SUM(IF(event_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 365 DAY), amount_eur, 0))
      - name: last_product_view_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de la derniere consultation de fiche produit (view_item) rattachee au client, en UTC. Renseignee uniquement pour le segment product_viewers_no_purchase, vide sinon.
        classification: confidential
        transformLogic: transform
        transformSourceObjects:
          - raw__pages_views__ga4#events.event_timestamp
          - raw__pages_views__ga4#events.event_name
          - raw__pages_views__ga4#events.user_pseudo_id
          - raw__pages_views__ga4#events.user_id
          - raw__pages_views__ga4#events.privacy_info.analytics_storage
          - raw__purchases__ga4#events.user_pseudo_id
          - raw__purchases__ga4#events.ecommerce.transaction_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.name
          - raw__customers__shopify#customers.id
          - raw__customers__shopify#customers.email
        transformDescription: Plus recente consultation de fiche produit des 14 derniers jours d'un visiteur rattache au client par un achat web passe ou par sa connexion.
        customProperties:
          - property: transformExpression
            value: MAX(TIMESTAMP_MICROS(event_timestamp))
      - name: meta_computed_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure du calcul de la ligne, en UTC.
        required: true
        classification: internal
        transformLogic: create
        transformDescription: Horodatage du calcul de la ligne.
        customProperties:
          - property: transformExpression
            value: CURRENT_TIMESTAMP()
