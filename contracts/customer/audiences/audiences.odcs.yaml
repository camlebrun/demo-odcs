# Contrat customer : audiences marketing quotidiennes (clients consentants). Voir docs/use-cases/audiences.md.
apiVersion: v3.2.0
kind: DataContract
id: audiences
name: audiences
version: 2.1.0
status: active
domain: customer
tags: [customer]
description:
  purpose: Audiences marketing a activer (exclusion acquisition, reactivation, retargeting, graine lookalike), uniquement pour des clients consentants. Une ligne par client (customer_key), segment et jour de calcul.
  usage: Alimente Google Customer Match et Meta Custom Audiences (CRM / marketing), chaque jour. Segments buyers_90d, inactive_12m, product_viewers_no_purchase, top_customers. 30 jours d'instantanes. Seul le hash customer_key est expose, jamais l'e-mail. Retrait de consentement non repercute chez Google et Meta, resynchroniser toute l'audience.
  limitations: customer_key = SHA256 de l'e-mail. Tickets sans carte (environ 50 %) hors audiences. Consentement = Shopify accepts_marketing + opt-in caisse, sans CRM ni ESP. Il porte sur l'e-mail ; l'usage publicitaire reste une decision juridique du proprietaire. Lien GA4-client partiel (achat web ou user_id suppose), product_viewers_no_purchase minoritaire.

servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la couche customer.
    project: retail-data-prod
    dataset: customer

team:
  name: team-customer
  description: Equipe proprietaire des contrats et des produits de donnees customer.
  members:
    - username: "@org/team-customer"
      role: owner

support:
  - channel: data-customer
    tool: email
    scope: issues
    url: mailto:data-customer@retail.example
    description: Questions et incidents sur les audiences marketing.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: customer_audiences
    driver: analytics
    description: Un recalcul complet par jour.
  - property: latency
    value: 1
    unit: d
    element: customer_audiences.audience_date
    driver: analytics
    description: Audiences buyers_90d, inactive_12m et top_customers du jour J disponibles au plus tard a J+1 matin, en tenant compte des latences des raw (caisse 12 h, Shopify 6 h). Le segment product_viewers_no_purchase depend de l'export GA4 (jusqu'a 24 h de latence), voir l'engagement dedie ci-dessous (J+2).
  - property: latency
    value: 2
    unit: d
    element: customer_audiences.last_product_view_at
    driver: analytics
    description: Segment product_viewers_no_purchase degrade a J+2 - l'export GA4 arrive jusqu'a 24 h apres la fin du jour, les vues du jour J ne sont donc fiables qu'a J+2.
  - property: retention
    value: 30
    unit: d
    element: customer_audiences
    description: Instantanes quotidiens conserves 30 jours (minimisation des donnees personnelles).

schema:
  - name: customer_audiences
    physicalName: customer_audiences
    physicalType: table
    description: Audiences marketing, une ligne par client consentant (customer_key) et par segment, recalculee chaque jour.
    dataGranularityDescription: Une ligne par client x segment x jour de calcul (audience_date) ; 30 jours d'instantanes sont conserves.
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table ne doit jamais etre vide apres un calcul.
      - type: sql
        query: SELECT COUNT(*) FROM (SELECT customer_key, segment_name, audience_date FROM ${table} GROUP BY customer_key, segment_name, audience_date HAVING COUNT(*) > 1)
        mustBe: 0
        dimension: uniqueness
        severity: error
        description: La cle composite du grain (customer_key, segment_name, audience_date) est unique.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE is_marketing_consented IS NOT TRUE
        mustBe: 0
        dimension: conformity
        severity: error
        description: Regle de consentement - la table ne contient que des clients ayant consenti, aucune ligne sans consentement actif.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE segment_name = 'buyers_90d' AND last_order_at < TIMESTAMP_SUB(meta_computed_at, INTERVAL 90 DAY)
        mustBe: 0
        dimension: accuracy
        severity: error
        description: Un acheteur du segment buyers_90d a un dernier achat de moins de 90 jours.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE segment_name = 'product_viewers_no_purchase' AND last_product_view_at IS NULL
        mustBe: 0
        dimension: completeness
        severity: error
        description: Un client du segment product_viewers_no_purchase a une date de derniere consultation de fiche produit.
    customProperties:
      - property: loadStrategy
        value: full_refresh
    properties:
      - name: customer_key
        physicalType: STRING
        logicalType: string
        description: Cle client pseudonymisee, SHA-256 hexadecimal en minuscules (64 caracteres) de l'e-mail normalise (minuscules, espaces retires). Valeur a charger telle quelle dans les audiences Customer Match et Custom Audiences. Reste une donnee personnelle au sens du RGPD.
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        classification: C2
        tags: [pseudonymized]
        logicalTypeOptions:
          minLength: 64
          maxLength: 64
        transformLogic: transform
        transformSourceObjects:
          - core__sales_events#sales_events.customer_key
          - core__customers#customers.customer_key
          - core__customers#customers.is_marketing_consented
          - core__web_events#web_events.user_id_customer_key
          - core__web_events#web_events.user_pseudo_id
          - core__web_events#web_events.event_type
          - core__web_events#web_events.is_analytics_consented
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.event_at
          - core__sales_events#sales_events.web_order_id
          - core__sales_events#sales_events.source_system
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.event_at
        transformDescription: >-
          Cle client (e-mail hache) calculee dans la couche core et reprise ici sans recalcul.
          Un client entre dans la table s'il appartient a au moins un segment (a partir de ses ventes,
          ou de ses consultations de fiches produit rattachees par achat web ou connexion) et si son
          consentement marketing le plus recent est positif. Jamais vide.
        customProperties:
          - property: transformExpression
            value: customer_key
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
      - name: segment_name
        physicalType: STRING
        logicalType: string
        description: Nom du segment d'audience - buyers_90d (exclusion acquisition), inactive_12m (reactivation), product_viewers_no_purchase (retargeting), top_customers (graine lookalike). Partie de la cle.
        primaryKey: true
        primaryKeyPosition: 2
        required: true
        classification: C2
        tags: [pseudonymized]
        enum:
          - value: buyers_90d
          - value: inactive_12m
          - value: product_viewers_no_purchase
          - value: top_customers
        transformLogic: transform
        transformSourceObjects:
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.event_id
          - core__sales_events#sales_events.amount_eur
          - core__web_events#web_events.event_at
          - core__sales_events#sales_events.customer_key
          - core__sales_events#sales_events.web_order_id
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.user_pseudo_id
          - core__web_events#web_events.user_id_customer_key
          - core__customers#customers.customer_key
          - core__web_events#web_events.event_type
          - core__web_events#web_events.is_analytics_consented
          - core__sales_events#sales_events.source_system
          - core__customers#customers.is_marketing_consented
        transformDescription: >-
          Nom du segment, ecrit en dur par chacune des quatre branches de l'union : buyers_90d (dernier
          achat de 90 jours ou moins), inactive_12m (dernier achat de plus de 365 jours), top_customers
          (au moins 2 achats sur 365 jours et CA net dans les 10 % les plus eleves),
          product_viewers_no_purchase (fiche produit vue sur 14 jours, sans achat depuis). Jamais vide.
        customProperties:
          - property: transformExpression
            value: segment_name
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: [buyers_90d, inactive_12m, product_viewers_no_purchase, top_customers]
            mustBe: 0
            dimension: conformity
            severity: error
      - name: audience_date
        physicalType: DATE
        logicalType: date
        description: Date de calcul de l'instantane (Europe/Paris). Les audiences a activer sont celles de la date la plus recente. Partie de la cle.
        primaryKey: true
        primaryKeyPosition: 3
        required: true
        classification: C2
        tags: [pseudonymized]
        transformLogic: create
        transformDescription: >-
          Date du jour du calcul, dans le fuseau Europe/Paris. Jamais vide.
        customProperties:
          - property: transformExpression
            value: CURRENT_DATE('Europe/Paris')
      - name: is_marketing_consented
        physicalType: BOOL
        logicalType: boolean
        description: Vrai si le signal de consentement marketing le plus recent du client (Shopify accepts_marketing ou opt-in fidelite en caisse) est un consentement. Toujours vrai dans cette table, qui ne contient que des consentants.
        required: true
        classification: C2
        tags: [pseudonymized]
        transformLogic: transform
        transformSourceObjects:
          - core__customers#customers.is_marketing_consented
          - core__customers#customers.customer_key
        transformDescription: >-
          Consentement marketing le plus recent du client, entre Shopify et la caisse. La regle est
          appliquee dans core__customers ; la valeur est reprise telle quelle. Un client sans signal ou
          avec un refus est exclu de la table : la colonne vaut donc toujours vrai.
        customProperties:
          - property: transformExpression
            value: customers.is_marketing_consented
      - name: consent_source
        physicalType: STRING
        logicalType: string
        description: Source du signal de consentement retenu - shopify (accepts_marketing) ou pos (opt-in fidelite en caisse).
        required: true
        classification: C2
        tags: [pseudonymized]
        enum:
          - value: shopify
          - value: pos
        transformLogic: transform
        transformSourceObjects:
          - core__customers#customers.consent_source
          - core__customers#customers.is_marketing_consented
          - core__customers#customers.customer_key
        transformDescription: >-
          Systeme (shopify ou pos) qui a emis le signal de consentement le plus recent du client.
          Repris de core__customers, rattache par customer_key, pour les seuls clients consentants.
          Jamais vide.
        customProperties:
          - property: transformExpression
            value: customers.consent_source
      - name: consent_updated_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure du signal de consentement retenu, en UTC. Peut etre vide si la source n'a pas horodate le consentement.
        classification: C2
        tags: [pseudonymized]
        transformLogic: transform
        transformSourceObjects:
          - core__customers#customers.consent_updated_at
          - core__customers#customers.is_marketing_consented
          - core__customers#customers.customer_key
        transformDescription: >-
          Date et heure (UTC) du signal de consentement le plus recent du client, entre Shopify et la
          caisse. Reprise de core__customers, rattachee par customer_key, pour les seuls clients
          consentants. Vide si la source n'a pas horodate le consentement.
        customProperties:
          - property: transformExpression
            value: customers.consent_updated_at
      - name: last_order_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de la derniere vente du client, tous canaux, en UTC (heure de caisse convertie avec le fuseau du magasin). Vide pour un client qui n'a jamais achete.
        classification: C2
        tags: [pseudonymized]
        transformLogic: transform
        transformSourceObjects:
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.customer_key
        transformDescription: >-
          Date et heure (UTC) de la vente la plus recente du client, tous canaux (tickets de caisse et
          commandes Shopify), sans limite d'anciennete. Les retours sont ignores. Vide pour un client
          present uniquement par ses consultations de fiches produit et qui n'a jamais achete.
        customProperties:
          - property: transformExpression
            value: MAX(IF(event_type = 'sale', event_at, NULL))
      - name: orders_12m_count
        physicalType: INT64
        logicalType: integer
        description: Nombre de ventes du client sur les 365 derniers jours, tous canaux.
        required: true
        classification: C2
        tags: [pseudonymized]
        transformLogic: transform
        transformSourceObjects:
          - core__sales_events#sales_events.event_id
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.customer_key
        transformDescription: >-
          Nombre de ventes distinctes (tickets de caisse et commandes Shopify) du client sur les
          365 jours precedant le calcul. Les retours ne sont pas comptes. Vaut 0 sans achat.
        customProperties:
          - property: transformExpression
            value: COUNT(DISTINCT IF(event_type = 'sale' AND event_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 365 DAY), event_id, NULL))
      - name: net_revenue_12m_eur
        physicalType: NUMERIC
        logicalType: number
        description: CA net de retours du client sur les 365 derniers jours, en EUR TTC, tous canaux. Sert au classement du segment top_customers.
        required: true
        classification: C2
        tags: [pseudonymized]
        transformLogic: transform
        transformSourceObjects:
          - core__sales_events#sales_events.amount_eur
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.customer_key
        transformDescription: >-
          Chiffre d'affaires net du client en euros TTC sur les 365 jours precedant le calcul, tous
          canaux : somme des montants des ventes et des retours. Vaut 0 sans achat sur la periode.
        customProperties:
          - property: transformExpression
            value: SUM(IF(event_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 365 DAY), amount_eur, 0))
      - name: last_product_view_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de la derniere consultation de fiche produit (view_item) rattachee au client, en UTC. Renseignee uniquement pour le segment product_viewers_no_purchase, vide sinon.
        classification: C2
        tags: [pseudonymized]
        transformLogic: transform
        transformSourceObjects:
          - core__web_events#web_events.event_at
          - core__web_events#web_events.event_type
          - core__web_events#web_events.user_pseudo_id
          - core__web_events#web_events.user_id_customer_key
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.is_analytics_consented
          - core__sales_events#sales_events.web_order_id
          - core__sales_events#sales_events.source_system
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.customer_key
        transformDescription: >-
          Date et heure (UTC) de la consultation de fiche produit (view_item) la plus recente des
          14 derniers jours, avec consentement analytics. Le visiteur GA4 est rattache au client par un
          achat web passe ou par sa connexion. Renseignee pour le seul segment
          product_viewers_no_purchase, vide pour les autres.
        customProperties:
          - property: transformExpression
            value: MAX(event_at)
      - name: meta_computed_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure du calcul de la ligne, en UTC.
        required: true
        classification: C2
        tags: [pseudonymized]
        transformLogic: create
        transformDescription: >-
          Date et heure (UTC) du calcul de la ligne. Jamais vide.
        customProperties:
          - property: transformExpression
            value: CURRENT_TIMESTAMP()
