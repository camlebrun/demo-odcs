# Contrat customer : indicateurs clients mensuels omnicanal (caisse + Shopify). Voir docs/use-cases/customer_kpis__pos_shopify.md.
apiVersion: v3.2.0
kind: DataContract
id: customer_kpis__pos_shopify
name: customer_kpis__pos_shopify
version: 1.0.0
status: active
domain: customer
tags: [customer]
description:
  purpose: Indicateurs clients et CA net de retours TTC par mois, canal (store ou web) et magasin (store_code, WEB pour le web), pour le controle de gestion et le comex. Une ligne par mois x canal x magasin.
  usage: Alimente le Power BI comex (DAF / controle de gestion). Rafraichi chaque jour (J+1), mois fige a M+3 jours ouvres. Montants en EUR TTC. Les clients distincts ne sont pas additifs entre lignes. Definitions detaillees dans la fiche et la customProperty details.
  limitations: Identite deterministe customer_key = SHA256(LOWER(TRIM(email))). Tickets sans carte (environ 50 %) anonymes, comptes dans le CA mais pas par client. Pas d'attribution marketing ni de consentement. CA TTC, EUR uniquement, rapproche du CA comptable (ecart < 0,5 %, controle hors lot 1). Voir details.

servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la couche customer.
    project: retail-data-prod
    dataset: customer

team:
  name: team-customer
  description: Equipe proprietaire des contrats et des produits de donnees customer.
  members:
    - username: "@org/team-customer"
      role: owner

support:
  - channel: data-customer
    tool: email
    scope: issues
    url: mailto:data-customer@retail.example
    description: Questions et incidents sur les indicateurs clients.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: customer_kpis_monthly
    driver: analytics
    description: Une mise a jour complete par jour.
  - property: latency
    value: 1
    unit: d
    element: customer_kpis_monthly.month_date
    driver: analytics
    description: J+1 - les donnees d'un jour J sont disponibles au plus tard le jour J+1.
  - property: monthClosingDelay
    value: 3
    unit: businessDays
    element: customer_kpis_monthly.month_date
    driver: analytics
    description: Le mois M est fige au plus tard a M+3 jours OUVRES (valeur 3 en jours ouvres, calendrier France, et non en jours calendaires). Apres le gel, les valeurs du mois ne changent plus.
  - property: retention
    value: 3
    unit: y
    element: customer_kpis_monthly
    description: Historique mensuel conserve 3 ans.

customProperties:
  - property: consumers
    value: Power BI comex (sponsor DAF / controle de gestion)
  - property: details
    value: |-
      Alimente le rapport Power BI comex (sponsor DAF / controle de gestion). Le mois est fige a M+3 jours OUVRES (non calendaires), la table est rafraichie chaque jour (J+1) ; un mois non fige peut encore bouger (retours, remboursements tardifs). Les montants sont en EUR decimal TTC, les mois sont calcules en date locale (magasin pour la caisse, Europe/Paris pour le web). Les mesures de clients distincts ne sont pas additives entre magasins ni entre canaux (un client present dans plusieurs cellules est compte dans chacune).
      Limites assumees du lot 1.
      (1) Identite client deterministe : customer_key = SHA256(LOWER(TRIM(email))), sans rapprochement flou. Les tickets sans carte fidelite sont anonymes (environ 50 % des tickets) : ils sont comptes dans le CA mais pas au niveau client (clients actifs, nouveaux, reachat, omnicanaux). Cote caisse l'e-mail vient de raw__loyalty_members__pos via loyalty_card_id (facultatif, saisi sans verification) ; cote Shopify de orders puis customers.
      (2) Un client qui achete en magasin sans carte puis sur le web est compte comme nouveau au premier achat identifie : les nouveaux clients et l'omnicanalite sont sous ou sur-estimes dans cette mesure. L'historique de depart est celui disponible dans les raw (3 ans).
      (3) Unites normalisees : caisse en centimes TTC et heure locale du magasin (le mois est pris sur la date locale du magasin, sans conversion de fuseau), Shopify en decimal TTC et UTC. Seules les lignes en EUR sont retenues (les autres devises sont ignorees). Commandes Shopify de test, annulees ou nees en caisse Shopify (source_name pos) exclues.
      (4) Retours : un retour en magasin d'un achat web (original_web_order_id) est impute au canal web, a la date du retour. Si Shopify a deja enregistre un remboursement pour la meme commande, le ticket de retour caisse est ignore pour ne pas compter deux fois. Les remboursements web sont les transactions de remboursement reussies, a la date du remboursement.
      (5) Le CA est TTC ; le rapprochement avec le CA comptable (hors lot 1, fourni par le controle de gestion) est un controle de reconciliation d'ecart inferieur a 0,5 % sur les mois figes.
      (6) Consentement, audiences et attribution marketing sont hors de ce contrat.
  - property: sponsor
    value: DAF / controle de gestion
  - property: accountingReconciliationReference
    value: Table de reference du CA comptable mensuel par canal et magasin, fournie par le controle de gestion (hors lot 1). Nom indicatif retail-data-prod.finance_controlling.accounting_revenue_monthly, colonnes month_date, channel, store_code, net_revenue_ttc_amount, is_closed. Le controle de qualite de reconciliation (ecart inferieur a 0,5 %) s'applique aux mois figes.
  - property: webStoreConvention
    value: Pour le canal web, store_code vaut WEB et store_id est NULL. Un retour en magasin d'un achat web est impute au canal web (store_code WEB).
  - property: transformInputs
    value: |-
      -- Ensemble intermediaire sur lequel portent les transformExpression des champs de cette table.
      -- Colonnes de la CTE events : month_date, event_date, channel, store_code, store_id, event_type (sale | return),
      -- order_id, amount_eur (positif pour une vente, negatif pour un retour), customer_key, first_order_date, is_omnichannel_12m.
      WITH web_orders AS (
        SELECT o.id, o.created_at, o.total_price,
               COALESCE(NULLIF(TRIM(o.email), ''), c.email) AS email
        FROM raw_shopify.orders o
        LEFT JOIN raw_shopify.customers c ON c.id = o.customer_id
        WHERE o.test = FALSE AND o.cancelled_at IS NULL AND o.currency = 'EUR'
          AND COALESCE(o.source_name, 'web') != 'pos'
          AND o.financial_status IN ('paid', 'partially_paid', 'partially_refunded', 'refunded')
      ),
      unified_events AS (
        SELECT IF(t.original_web_order_id IS NULL, 'store', 'web') AS channel,
               IF(t.original_web_order_id IS NULL, s.store_code, 'WEB') AS store_code,
               IF(t.original_web_order_id IS NULL, t.store_id, NULL) AS store_id,
               DATE(t.ticket_datetime_local) AS event_date,
               t.ticket_type AS event_type,
               CONCAT('pos:', CAST(t.ticket_id AS STRING)) AS order_id,
               CAST(t.total_amount_cents AS NUMERIC) / 100 AS amount_eur,
               COALESCE(NULLIF(TRIM(lm.email), ''), wo.email) AS email
        FROM raw_pos.tickets t
        JOIN raw_pos.stores s ON s.store_id = t.store_id
        LEFT JOIN raw_pos.loyalty_members lm ON lm.loyalty_card_id = t.loyalty_card_id
        LEFT JOIN web_orders wo ON wo.id = t.original_web_order_id
        WHERE t.currency = 'EUR'
          AND NOT (t.original_web_order_id IS NOT NULL
                   AND EXISTS (SELECT 1 FROM raw_shopify.refunds r WHERE r.order_id = t.original_web_order_id))
        UNION ALL
        SELECT 'web', 'WEB', NULL, DATE(wo.created_at, 'Europe/Paris'), 'sale',
               CONCAT('web:', CAST(wo.id AS STRING)), wo.total_price, wo.email
        FROM web_orders wo
        UNION ALL
        SELECT 'web', 'WEB', NULL, DATE(r.created_at, 'Europe/Paris'), 'return',
               CONCAT('refund:', CAST(r.id AS STRING)),
               -(SELECT IFNULL(SUM(tr.amount), 0) FROM UNNEST(r.transactions) tr
                 WHERE tr.kind = 'refund' AND tr.status = 'success' AND tr.currency = 'EUR'),
               wo.email
        FROM raw_shopify.refunds r
        JOIN web_orders wo ON wo.id = r.order_id
      ),
      base AS (
        SELECT e.*, DATE_TRUNC(e.event_date, MONTH) AS month_date,
               IF(NULLIF(TRIM(e.email), '') IS NULL, NULL, TO_HEX(SHA256(LOWER(TRIM(e.email))))) AS customer_key
        FROM unified_events e
      ),
      customer_first_order AS (
        SELECT customer_key, MIN(event_date) AS first_order_date
        FROM base WHERE event_type = 'sale' AND customer_key IS NOT NULL GROUP BY customer_key
      ),
      customer_omnichannel AS (
        SELECT m.customer_key, m.month_date, COUNT(DISTINCT e.channel) = 2 AS is_omnichannel_12m
        FROM (SELECT DISTINCT customer_key, month_date FROM base WHERE event_type = 'sale' AND customer_key IS NOT NULL) m
        JOIN base e ON e.customer_key = m.customer_key AND e.event_type = 'sale'
         AND e.month_date BETWEEN DATE_SUB(m.month_date, INTERVAL 11 MONTH) AND m.month_date
        GROUP BY m.customer_key, m.month_date
      ),
      events AS (
        SELECT b.*, f.first_order_date, o.is_omnichannel_12m
        FROM base b
        LEFT JOIN customer_first_order f USING (customer_key)
        LEFT JOIN customer_omnichannel o USING (customer_key, month_date)
      )
      -- Chaque champ est calcule par : SELECT month_date, channel, store_code, <mesures> FROM events GROUP BY month_date, channel, store_code

schema:
  - name: customer_kpis_monthly
    physicalName: customer_kpis_monthly
    physicalType: table
    description: Indicateurs clients et chiffre d'affaires net de retours, une ligne par mois, canal (store ou web) et magasin (store_code, WEB pour le web).
    dataGranularityDescription: Une ligne par mois x canal x magasin.
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table ne doit jamais etre vide apres un calcul.
      - type: sql
        query: SELECT COUNT(*) FROM (SELECT month_date, channel, store_code FROM ${table} GROUP BY month_date, channel, store_code HAVING COUNT(*) > 1)
        mustBe: 0
        dimension: uniqueness
        severity: error
        description: La cle composite du grain (month_date, channel, store_code) est unique.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE ABS(net_revenue_amount - (identified_net_revenue_amount + anonymous_net_revenue_amount)) > 0.01
        mustBe: 0
        dimension: consistency
        severity: error
        description: Le CA net est la somme du CA identifie et du CA anonyme (tolerance 1 centime).
      - type: sql
        query: |-
          SELECT COUNT(*) FROM ${table} k
          FULL OUTER JOIN `retail-data-prod.finance_controlling.accounting_revenue_monthly` a
            ON a.month_date = k.month_date AND a.channel = k.channel AND a.store_code = k.store_code
          WHERE COALESCE(k.month_date, a.month_date) < DATE_TRUNC(CURRENT_DATE('Europe/Paris'), MONTH)
            AND COALESCE(a.is_closed, TRUE)
            AND (k.month_date IS NULL OR a.month_date IS NULL
                 OR IFNULL(SAFE_DIVIDE(ABS(k.net_revenue_amount - a.net_revenue_ttc_amount), ABS(a.net_revenue_ttc_amount)), 1) >= 0.005)
        mustBe: 0
        dimension: accuracy
        severity: error
        description: Controle de reconciliation fourni par le controle de gestion (hors lot 1). Sur les mois passes et figes, l'ecart entre le CA net TTC de la table et le CA comptable de reference doit rester inferieur a 0,5 % (seuil 0,005) pour chaque mois, canal et magasin. Echoue aussi si un mois, un canal ou un magasin existe d'un seul cote, ou si le CA comptable vaut 0.
    properties:
      - name: month_date
        physicalType: DATE
        logicalType: date
        description: Premier jour du mois calendaire (date locale du magasin pour la caisse, Europe/Paris pour le web). Partie de la cle.
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        classification: internal
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__orders__shopify#orders.created_at
          - raw__refunds__shopify#refunds.created_at
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__stores__pos#stores.store_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__refunds__shopify#refunds.order_id
          - raw__customers__shopify#customers.id
        transformDescription: Mois de la date locale du ticket de caisse, de la commande Shopify ou du remboursement Shopify (converti en Europe/Paris).
        customProperties:
          - property: transformExpression
            value: DATE_TRUNC(event_date, MONTH)
      - name: channel
        physicalType: STRING
        logicalType: string
        description: Canal de la vente - store (achat en magasin) ou web (achat Shopify, y compris son retour en magasin). Partie de la cle.
        primaryKey: true
        primaryKeyPosition: 2
        required: true
        classification: internal
        enum:
          - value: store
          - value: web
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__orders__shopify#orders.id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__stores__pos#stores.store_id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__refunds__shopify#refunds.order_id
          - raw__customers__shopify#customers.id
        transformDescription: Canal web pour les commandes Shopify et les retours en magasin d'une commande web, canal store pour les autres tickets de caisse.
        customProperties:
          - property: transformExpression
            value: channel
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: [store, web]
            mustBe: 0
            dimension: conformity
            severity: error
      - name: store_code
        physicalType: STRING
        logicalType: string
        description: Code court du magasin, ou la valeur conventionnelle WEB pour le canal web (aucun magasin). Partie de la cle.
        primaryKey: true
        primaryKeyPosition: 3
        required: true
        classification: internal
        examples: [WEB]
        transformLogic: transform
        transformSourceObjects:
          - raw__stores__pos#stores.store_code
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__stores__pos#stores.store_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__refunds__shopify#refunds.order_id
          - raw__customers__shopify#customers.id
        transformDescription: Code du magasin du ticket, ou WEB pour le canal web.
        customProperties:
          - property: transformExpression
            value: store_code
      - name: store_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant technique du magasin dans la caisse. NULL pour le canal web.
        classification: internal
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__tickets__pos#tickets.currency
          - raw__stores__pos#stores.store_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__refunds__shopify#refunds.order_id
          - raw__customers__shopify#customers.id
        transformDescription: Identifiant du magasin du ticket, NULL pour le canal web.
        customProperties:
          - property: transformExpression
            value: ANY_VALUE(store_id)
      - name: currency
        physicalType: STRING
        logicalType: string
        description: Code devise ISO 4217 de tous les montants de la ligne (toujours EUR dans le lot 1).
        required: true
        classification: internal
        logicalTypeOptions:
          minLength: 3
          maxLength: 3
        examples: [EUR]
        transformLogic: create
        transformDescription: Constante EUR, seules les lignes en euros etant retenues.
        customProperties:
          - property: transformExpression
            value: "'EUR'"
      - name: active_customers_count
        physicalType: INT64
        logicalType: integer
        description: Nombre de clients identifies distincts ayant au moins une vente dans le mois sur ce canal et ce magasin. Les clients anonymes sont exclus. Non additif entre lignes.
        required: true
        classification: internal
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.loyalty_card_id
          - raw__loyalty_members__pos#loyalty_members.email
          - raw__orders__shopify#orders.email
          - raw__customers__shopify#customers.email
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.ticket_type
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__stores__pos#stores.store_id
          - raw__loyalty_members__pos#loyalty_members.loyalty_card_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.created_at
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
          - raw__refunds__shopify#refunds.id
          - raw__refunds__shopify#refunds.order_id
          - raw__refunds__shopify#refunds.created_at
          - raw__refunds__shopify#refunds.transactions.kind
          - raw__refunds__shopify#refunds.transactions.status
          - raw__refunds__shopify#refunds.transactions.currency
        transformDescription: Comptage des customer_key distincts ayant une vente dans la cellule mois x canal x magasin.
        customProperties:
          - property: transformExpression
            value: COUNT(DISTINCT IF(event_type = 'sale', customer_key, NULL))
      - name: new_customers_count
        physicalType: INT64
        logicalType: integer
        description: Clients actifs de la ligne dont la premiere vente identifiee, tous canaux confondus, tombe dans le mois.
        required: true
        classification: internal
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__loyalty_members__pos#loyalty_members.email
          - raw__orders__shopify#orders.created_at
          - raw__orders__shopify#orders.email
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.ticket_type
          - raw__tickets__pos#tickets.loyalty_card_id
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__stores__pos#stores.store_id
          - raw__loyalty_members__pos#loyalty_members.loyalty_card_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
          - raw__customers__shopify#customers.email
          - raw__refunds__shopify#refunds.id
          - raw__refunds__shopify#refunds.order_id
          - raw__refunds__shopify#refunds.created_at
          - raw__refunds__shopify#refunds.transactions.kind
          - raw__refunds__shopify#refunds.transactions.status
          - raw__refunds__shopify#refunds.transactions.currency
        transformDescription: Clients actifs dont la date de premiere vente (minimum toutes sources) est dans le mois de la ligne.
        customProperties:
          - property: transformExpression
            value: COUNT(DISTINCT IF(event_type = 'sale' AND DATE_TRUNC(first_order_date, MONTH) = month_date, customer_key, NULL))
      - name: repeat_customers_count
        physicalType: INT64
        logicalType: integer
        description: Clients actifs de la ligne dont la premiere vente identifiee est anterieure au mois (clients de reachat). Clients actifs = nouveaux + reachat.
        required: true
        classification: internal
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__loyalty_members__pos#loyalty_members.email
          - raw__orders__shopify#orders.created_at
          - raw__orders__shopify#orders.email
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.ticket_type
          - raw__tickets__pos#tickets.loyalty_card_id
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__stores__pos#stores.store_id
          - raw__loyalty_members__pos#loyalty_members.loyalty_card_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
