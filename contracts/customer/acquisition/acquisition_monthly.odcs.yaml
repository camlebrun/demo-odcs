# Contrat customer : acquisition de nouveaux clients web par campagne paid media. Voir docs/use-cases/acquisition_monthly.md.
apiVersion: v3.2.0
kind: DataContract
id: acquisition_monthly
name: acquisition_monthly
version: 2.0.0
status: active
domain: customer
tags: [customer]
description:
  purpose: Efficacite de l'acquisition de nouveaux clients web par canal et campagne paid media (Google Ads, Meta Ads). Une ligne par mois x canal x campagne - depense, nouveaux clients, CAC, CA du premier achat, ROAS nouveaux clients, valeur de cohorte a 90 jours.
  usage: Alimente la revue paid media hebdomadaire sous Power BI. Canaux google_ads, meta_ads, other_web ; campaign_id 0 si achat non rapproche. Le ROAS des plateformes n'est pas utilise car non deduplique, seul le ROAS nouveaux clients calcule sur Shopify est publie. Une commande suit sa campagne au jour de l'achat, pas du clic.
  limitations: Attribution web uniquement, last-click GA4, magasins exclus. Identite deterministe customer_key (SHA256 de l'e-mail) - un client deja vu en magasin peut compter comme nouveau ; tickets sans carte anonymes. Consentement hors perimetre. Campagne rapprochee par nom UTM. ROAS en TTC contre depense plateforme non confirmee.

servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la couche customer.
    project: retail-data-prod
    dataset: customer

team:
  name: team-customer
  description: Equipe proprietaire des contrats et des produits de donnees customer.
  members:
    - username: "@org/team-customer"
      role: owner

support:
  - channel: data-customer
    tool: email
    scope: issues
    url: mailto:data-customer@retail.example
    description: Questions et incidents sur les indicateurs d'acquisition.

slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: customer_acquisition_monthly
    driver: analytics
    description: Une mise a jour complete par jour, la revue paid media etant hebdomadaire.
  - property: latency
    value: 1
    unit: d
    element: customer_acquisition_monthly.month_date
    driver: analytics
    description: Donnees du jour J disponibles au plus tard a J+1 ; les jours recents restent revises par les plateformes publicitaires.
  - property: retention
    value: 3
    unit: y
    element: customer_acquisition_monthly
    description: Historique mensuel conserve 3 ans.

customProperties:
  - property: sponsor
    value: Acquisition
  - property: attributionModel
    value: last-click GA4, web uniquement
  - property: platformRoasNotUsed
    value: Les conversions Google Ads (metrics_conversions, metrics_conversions_value) et les actions Meta (actions, action_values, purchase_roas) sont des mesures plateforme non dedupliquees ; elles ne servent a aucun calcul.
  - property: transformInputs
    value: |-
      -- Ensemble intermediaire sur lequel portent les transformExpression des champs de cette table.
      -- Colonnes de acq_facts : month_date, channel (google_ads | meta_ads | other_web), campaign_id (0 si non rapproche), campaign_name,
      -- spend_eur (lignes de depense), customer_key, first_order_revenue_eur, cohort_value_90d_eur, is_cohort_90d_mature (lignes de nouveaux clients).
      WITH shopify_events AS (
        -- Les retours en caisse ne comptent pas dans la cohorte web.
        SELECT web_order_id, event_type, event_at, amount_eur, customer_key
        FROM core.sales_events WHERE source_system = 'shopify'
      ),
      first_orders AS (
        SELECT cu.customer_key,
               ARRAY_AGG(STRUCT(e.web_order_id AS id, e.event_at AS created_at, e.amount_eur AS total_price) LIMIT 1)[OFFSET(0)] AS first_order
        FROM core.customers cu
        JOIN shopify_events e ON e.customer_key = cu.customer_key AND e.event_type = 'sale' AND e.event_at = cu.first_web_order_at
        GROUP BY cu.customer_key
      ),
      attributed AS (
        -- Premier achat GA4 par commande.
        SELECT web_order_id AS order_id, marketing_channel AS channel, utm_campaign
        FROM core.web_events
        WHERE event_type = 'purchase' AND web_order_id IS NOT NULL
        QUALIFY ROW_NUMBER() OVER (PARTITION BY web_order_id ORDER BY event_at) = 1
      ),
      cohort AS (
        SELECT fo.customer_key, SUM(e.amount_eur) AS value_90d
        FROM first_orders fo
        JOIN shopify_events e ON e.customer_key = fo.customer_key
         AND e.event_at < TIMESTAMP_ADD(fo.first_order.created_at, INTERVAL 90 DAY)
        GROUP BY fo.customer_key
      ),
      new_customer_rows AS (
        SELECT DATE_TRUNC(DATE(fo.first_order.created_at, 'Europe/Paris'), MONTH) AS month_date,
               IFNULL(a.channel, 'other_web') AS channel,
               IFNULL(ca.campaign_id, 0) AS campaign_id,
               ca.campaign_name,
               fo.customer_key,
               fo.first_order.total_price AS first_order_revenue_eur,
               IFNULL(co.value_90d, 0) AS cohort_value_90d_eur,
               TIMESTAMP_ADD(fo.first_order.created_at, INTERVAL 90 DAY) <= CURRENT_TIMESTAMP() AS is_cohort_90d_mature
        FROM first_orders fo
        LEFT JOIN attributed a ON a.order_id = fo.first_order.id
        LEFT JOIN cohort co ON co.customer_key = fo.customer_key
        LEFT JOIN core.campaigns ca ON ca.platform = a.channel
          AND (a.utm_campaign = LOWER(TRIM(ca.campaign_name))
               OR (ca.platform = 'meta_ads' AND a.utm_campaign = CAST(ca.campaign_id AS STRING)))
      ),
      spend_rows AS (
        SELECT DATE_TRUNC(sp.spend_date, MONTH) AS month_date, sp.platform AS channel, sp.campaign_id, ca.campaign_name, sp.spend_eur
        FROM core.ad_spend sp
        LEFT JOIN core.campaigns ca ON ca.platform = sp.platform AND ca.campaign_id = sp.campaign_id
      ),
      acq_facts AS (
        SELECT month_date, channel, campaign_id, campaign_name, spend_eur,
               CAST(NULL AS STRING) AS customer_key, CAST(NULL AS NUMERIC) AS first_order_revenue_eur,
               CAST(NULL AS NUMERIC) AS cohort_value_90d_eur, CAST(NULL AS BOOL) AS is_cohort_90d_mature
        FROM spend_rows
        UNION ALL
        SELECT month_date, channel, campaign_id, COALESCE(campaign_name, 'unattributed'), NULL,
               customer_key, first_order_revenue_eur, cohort_value_90d_eur, is_cohort_90d_mature
        FROM new_customer_rows
      )
      -- Chaque champ est calcule par : SELECT month_date, channel, campaign_id, <mesures> FROM acq_facts GROUP BY month_date, channel, campaign_id

schema:
  - name: customer_acquisition_monthly
    physicalName: customer_acquisition_monthly
    physicalType: table
    description: Acquisition de nouveaux clients web par campagne paid media, une ligne par mois, canal (google_ads, meta_ads, other_web) et campagne.
    dataGranularityDescription: Une ligne par mois x canal x campagne (campaign_id 0 quand l'achat n'est pas rapproche d'une campagne).
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table ne doit jamais etre vide apres un calcul.
      - type: sql
        query: SELECT COUNT(*) FROM (SELECT month_date, channel, campaign_id FROM ${table} GROUP BY month_date, channel, campaign_id HAVING COUNT(*) > 1)
        mustBe: 0
        dimension: uniqueness
        severity: error
        description: La cle composite du grain (month_date, channel, campaign_id) est unique.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE channel = 'other_web' AND spend_amount > 0
        mustBe: 0
        dimension: consistency
        severity: error
        description: Le trafic web non paye n'a aucune depense.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE new_customers_count = 0 AND cac_amount IS NOT NULL
        mustBe: 0
        dimension: consistency
        severity: warning
        description: Sans nouveau client, le CAC n'est pas defini.
    customProperties:
      - property: loadStrategy
        value: full_refresh
    properties:
      - name: month_date
        physicalType: DATE
        logicalType: date
        description: Premier jour du mois calendaire de la depense publicitaire (fuseau du compte) ou de la premiere commande (Europe/Paris). Partie de la cle.
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__ad_spend#ad_spend.spend_date
          - core__sales_events#sales_events.event_at
          - core__customers#customers.first_web_order_at
          - core__customers#customers.customer_key
          - core__sales_events#sales_events.customer_key
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.source_system
        transformDescription: Mois du jour de depense Google Ads ou Meta, ou de la premiere commande Shopify convertie en Europe/Paris.
        customProperties:
          - property: transformExpression
            value: month_date
      - name: channel
        physicalType: STRING
        logicalType: string
        description: Canal d'acquisition - google_ads, meta_ads ou other_web (trafic web sans clic payant reconnu, sans depense). Partie de la cle.
        primaryKey: true
        primaryKeyPosition: 2
        required: true
        classification: C1
        enum:
          - value: google_ads
          - value: meta_ads
          - value: other_web
        transformLogic: transform
        transformSourceObjects:
          - core__ad_spend#ad_spend.platform
          - core__web_events#web_events.marketing_channel
          - core__web_events#web_events.utm_campaign
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.event_type
          - core__web_events#web_events.event_at
          - core__sales_events#sales_events.web_order_id
          - core__customers#customers.first_web_order_at
          - core__customers#customers.customer_key
          - core__sales_events#sales_events.customer_key
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.source_system
          - core__sales_events#sales_events.event_at
        transformDescription: Canal deduit de la source collectee sur l'evenement purchase GA4 (gclid ou UTM), google_ads et meta_ads pour la depense de la plateforme correspondante.
        customProperties:
          - property: transformExpression
            value: channel
      - name: campaign_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant de campagne Google Ads ou Meta ; 0 quand l'achat n'est rapproche d'aucune campagne (other_web ou nom UTM non retrouve). Partie de la cle.
        primaryKey: true
        primaryKeyPosition: 3
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__ad_spend#ad_spend.campaign_id
          - core__campaigns#campaigns.platform
          - core__campaigns#campaigns.campaign_id
          - core__campaigns#campaigns.campaign_name
          - core__web_events#web_events.utm_campaign
          - core__web_events#web_events.marketing_channel
          - core__web_events#web_events.web_order_id
        transformDescription: Identifiant de campagne Google Ads ou Meta de la depense, ou de la campagne rapprochee de l'achat par son nom UTM, 0 sinon.
        customProperties:
          - property: transformExpression
            value: campaign_id
      - name: campaign_name
        physicalType: STRING
        logicalType: string
        description: Nom de la campagne tel que saisi dans la plateforme, ou unattributed quand aucune campagne n'est rapprochee.
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__campaigns#campaigns.platform
          - core__campaigns#campaigns.campaign_id
          - core__campaigns#campaigns.campaign_name
          - core__ad_spend#ad_spend.campaign_id
          - core__ad_spend#ad_spend.platform
          - core__web_events#web_events.utm_campaign
          - core__web_events#web_events.marketing_channel
        transformDescription: Nom de la campagne Google Ads ou Meta, unattributed quand l'achat n'est rapproche d'aucune campagne.
        customProperties:
          - property: transformExpression
            value: ANY_VALUE(campaign_name)
      - name: currency
        physicalType: STRING
        logicalType: string
        description: Code devise ISO 4217 de tous les montants de la ligne (toujours EUR dans le lot 1).
        required: true
        classification: C1
        logicalTypeOptions:
          minLength: 3
          maxLength: 3
        examples: [EUR]
        transformLogic: create
        transformDescription: Constante EUR, seules les lignes en euros etant retenues.
        customProperties:
          - property: transformExpression
            value: "'EUR'"
      - name: spend_amount
        physicalType: NUMERIC
        logicalType: number
        description: Depense publicitaire du mois pour la campagne, en EUR (micros Google Ads divises par 1 000 000, depense Meta decimale). Vaut 0 pour other_web.
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__ad_spend#ad_spend.spend_eur
          - core__ad_spend#ad_spend.spend_date
          - core__ad_spend#ad_spend.platform
          - core__ad_spend#ad_spend.campaign_id
        transformDescription: Somme de la depense quotidienne de core__ad_spend, en EUR.
        customProperties:
          - property: transformExpression
            value: IFNULL(SUM(spend_eur), 0)
      - name: new_customers_count
        physicalType: INT64
        logicalType: integer
        description: Nombre de nouveaux clients web (premiere commande Shopify identifiee par e-mail) attribues a la campagne en last-click GA4.
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__customers#customers.customer_key
          - core__customers#customers.first_web_order_at
          - core__sales_events#sales_events.source_system
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.customer_key
          - core__web_events#web_events.marketing_channel
          - core__web_events#web_events.utm_campaign
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.event_type
          - core__web_events#web_events.event_at
          - core__sales_events#sales_events.web_order_id
          - core__campaigns#campaigns.platform
          - core__campaigns#campaigns.campaign_id
          - core__campaigns#campaigns.campaign_name
        transformDescription: Comptage des clients dont la premiere commande Shopify est rattachee a la ligne par le pont transaction_id et la source GA4.
        customProperties:
          - property: transformExpression
            value: COUNT(DISTINCT customer_key)
      - name: cac_amount
        physicalType: NUMERIC
        logicalType: number
        description: Cout d'acquisition d'un nouveau client en EUR, depense divisee par le nombre de nouveaux clients. NULL sans nouveau client.
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__ad_spend#ad_spend.spend_eur
          - core__ad_spend#ad_spend.spend_date
          - core__ad_spend#ad_spend.platform
          - core__ad_spend#ad_spend.campaign_id
          - core__customers#customers.customer_key
          - core__customers#customers.first_web_order_at
          - core__sales_events#sales_events.source_system
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.customer_key
          - core__web_events#web_events.marketing_channel
          - core__web_events#web_events.utm_campaign
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.event_type
          - core__web_events#web_events.event_at
          - core__sales_events#sales_events.web_order_id
          - core__campaigns#campaigns.platform
          - core__campaigns#campaigns.campaign_id
          - core__campaigns#campaigns.campaign_name
        transformDescription: Depense divisee par le nombre de nouveaux clients, NULL sans nouveau client.
        customProperties:
          - property: transformExpression
            value: SAFE_DIVIDE(SUM(spend_eur), COUNT(DISTINCT customer_key))
      - name: first_order_revenue_amount
        physicalType: NUMERIC
        logicalType: number
        description: CA du premier achat des nouveaux clients, en EUR TTC, avant retours (total_price de la commande).
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__sales_events#sales_events.amount_eur
          - core__customers#customers.customer_key
          - core__customers#customers.first_web_order_at
          - core__sales_events#sales_events.source_system
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.customer_key
          - core__web_events#web_events.marketing_channel
          - core__web_events#web_events.utm_campaign
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.event_type
          - core__web_events#web_events.event_at
          - core__sales_events#sales_events.web_order_id
          - core__campaigns#campaigns.platform
          - core__campaigns#campaigns.campaign_id
          - core__campaigns#campaigns.campaign_name
        transformDescription: Somme des totaux TTC des premieres commandes des nouveaux clients de la ligne.
        customProperties:
          - property: transformExpression
            value: IFNULL(SUM(first_order_revenue_eur), 0)
      - name: new_customer_roas
        physicalType: NUMERIC
        logicalType: number
        description: ROAS nouveaux clients, CA du premier achat divise par la depense (sans unite). Calcule sur les commandes Shopify (CA TTC) rapporte a la depense plateforme dont le TTC ou HT n'est pas confirme, donc indicatif ; jamais sur les conversions des plateformes (non dedupliquees). NULL sans depense.
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__sales_events#sales_events.amount_eur
          - core__ad_spend#ad_spend.spend_eur
          - core__ad_spend#ad_spend.spend_date
          - core__ad_spend#ad_spend.platform
          - core__ad_spend#ad_spend.campaign_id
          - core__customers#customers.customer_key
          - core__customers#customers.first_web_order_at
          - core__sales_events#sales_events.source_system
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.customer_key
          - core__web_events#web_events.marketing_channel
          - core__web_events#web_events.utm_campaign
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.event_type
          - core__web_events#web_events.event_at
          - core__sales_events#sales_events.web_order_id
          - core__campaigns#campaigns.platform
          - core__campaigns#campaigns.campaign_id
          - core__campaigns#campaigns.campaign_name
        transformDescription: CA du premier achat divise par la depense, calcule sur les commandes Shopify et non sur les conversions plateforme.
        customProperties:
          - property: transformExpression
            value: SAFE_DIVIDE(SUM(first_order_revenue_eur), SUM(spend_eur))
      - name: cohort_value_90d_amount
        physicalType: NUMERIC
        logicalType: number
        description: Valeur de cohorte a 90 jours, en EUR TTC - CA net de retours des commandes web des nouveaux clients sur les 90 jours suivant leur premiere commande. NULL tant que la cohorte n'a pas 90 jours de recul.
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__sales_events#sales_events.amount_eur
          - core__customers#customers.customer_key
          - core__customers#customers.first_web_order_at
          - core__sales_events#sales_events.source_system
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.customer_key
          - core__web_events#web_events.marketing_channel
          - core__web_events#web_events.utm_campaign
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.event_type
          - core__web_events#web_events.event_at
          - core__sales_events#sales_events.web_order_id
          - core__campaigns#campaigns.platform
          - core__campaigns#campaigns.campaign_id
          - core__campaigns#campaigns.campaign_name
        transformDescription: CA net de retours des commandes web des nouveaux clients sur 90 jours apres leur premiere commande, NULL tant que la cohorte est immature.
        customProperties:
          - property: transformExpression
            value: IF(LOGICAL_AND(IFNULL(is_cohort_90d_mature, TRUE)), SUM(cohort_value_90d_eur), NULL)
      - name: is_cohort_90d_mature
        physicalType: BOOL
        logicalType: boolean
        description: Vrai quand tous les nouveaux clients de la ligne ont au moins 90 jours de recul, donc quand cohort_value_90d_amount est renseignee.
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - core__customers#customers.customer_key
          - core__customers#customers.first_web_order_at
          - core__sales_events#sales_events.source_system
          - core__sales_events#sales_events.event_type
          - core__sales_events#sales_events.event_at
          - core__sales_events#sales_events.customer_key
          - core__web_events#web_events.marketing_channel
          - core__web_events#web_events.utm_campaign
          - core__web_events#web_events.web_order_id
          - core__web_events#web_events.event_type
          - core__web_events#web_events.event_at
          - core__sales_events#sales_events.web_order_id
          - core__campaigns#campaigns.platform
          - core__campaigns#campaigns.campaign_id
          - core__campaigns#campaigns.campaign_name
        transformDescription: Vrai quand tous les nouveaux clients de la ligne ont au moins 90 jours de recul.
        customProperties:
          - property: transformExpression
            value: LOGICAL_AND(IFNULL(is_cohort_90d_mature, TRUE))
      - name: meta_computed_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure du calcul de la ligne, en UTC (champ technique).
        required: true
        classification: C1
        transformLogic: create
        transformDescription: Horodatage du calcul de la ligne.
        customProperties:
          - property: transformExpression
            value: CURRENT_TIMESTAMP()
