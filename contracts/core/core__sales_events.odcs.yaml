apiVersion: v3.2.0
kind: DataContract
id: core__sales_events
name: core__sales_events
version: 1.0.0
status: active
domain: core
tags:
  - core
description:
  purpose: Toutes les ventes et tous les retours, magasin et web, dans une seule table. Les règles de commande valide, de remboursement et de non double comptage sont écrites ici, et nulle part ailleurs.
  usage: Source unique des ventes pour les indicateurs, les audiences et l'acquisition. Filtrer source_system = 'shopify' pour ne garder que Shopify.
  limitations: EUR et TTC uniquement. Environ 50 % des tickets sans carte restent anonymes.
servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la couche core.
    project: retail-data-prod
    dataset: core
team:
  name: team-core
  description: Equipe propriétaire de la couche core.
  members:
    - username: '@org/team-core'
      role: owner
support:
  - channel: data-core
    tool: email
    scope: issues
    url: mailto:data-core@retail.example
    description: Questions et incidents sur la couche core.
slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: sales_events
    driver: analytics
    description: Un recalcul complet par jour.
  - property: latency
    value: 12
    unit: h
    element: sales_events.meta_computed_at
    driver: analytics
    description: Données disponibles au plus tard 12 h après la fin du jour, comme la source la plus lente.
  - property: retention
    value: 3
    unit: y
    element: sales_events
    description: Historique conservé 3 ans.
customProperties:
  - property: transformInputs
    value: |-
      -- Ensemble intermédiaire sur lequel portent les transformExpression des champs de cette table.
      -- Colonnes de la CTE events : celles de la table, plus email (jamais publié).
      WITH web_orders AS (
        -- Règle « commande web valide ».
        SELECT o.id, o.created_at, o.total_price,
               COALESCE(NULLIF(TRIM(o.email), ''), c.email) AS email
        FROM raw_shopify.orders o
        LEFT JOIN raw_shopify.customers c ON c.id = o.customer_id
        WHERE o.test = FALSE AND o.cancelled_at IS NULL AND o.currency = 'EUR'
          AND COALESCE(o.source_name, 'web') != 'pos'
          AND o.financial_status IN ('paid', 'partially_paid', 'partially_refunded', 'refunded')
      ),
      events AS (
        SELECT CONCAT('pos:', CAST(t.ticket_id AS STRING)) AS event_id, 'pos' AS source_system, t.ticket_type AS event_type,
               IF(t.original_web_order_id IS NULL, 'store', 'web') AS channel,
               IF(t.original_web_order_id IS NULL, t.store_id, NULL) AS store_id,
               IF(t.original_web_order_id IS NULL, s.store_code, 'WEB') AS store_code,
               TIMESTAMP(t.ticket_datetime_local, s.timezone) AS event_at,
               DATE(t.ticket_datetime_local) AS event_date,
               CAST(t.total_amount_cents AS NUMERIC) / 100 AS amount_eur,
               COALESCE(NULLIF(TRIM(lm.email), ''), wo.email) AS email,
               t.original_web_order_id AS web_order_id
        FROM raw_pos.tickets t
        JOIN raw_pos.stores s ON s.store_id = t.store_id
        LEFT JOIN raw_pos.loyalty_members lm ON lm.loyalty_card_id = t.loyalty_card_id
        LEFT JOIN web_orders wo ON wo.id = t.original_web_order_id
        WHERE t.currency = 'EUR'
          -- Un retour déjà remboursé sur Shopify n'est pas compté deux fois.
          AND NOT (t.original_web_order_id IS NOT NULL
                   AND EXISTS (SELECT 1 FROM raw_shopify.refunds r WHERE r.order_id = t.original_web_order_id))
        UNION ALL
        SELECT CONCAT('web:', CAST(wo.id AS STRING)), 'shopify', 'sale', 'web', NULL, 'WEB',
               wo.created_at, DATE(wo.created_at, 'Europe/Paris'), wo.total_price, wo.email, wo.id
        FROM web_orders wo
        UNION ALL
        SELECT CONCAT('refund:', CAST(r.id AS STRING)), 'shopify', 'return', 'web', NULL, 'WEB',
               r.created_at, DATE(r.created_at, 'Europe/Paris'),
               -(SELECT IFNULL(SUM(tr.amount), 0) FROM UNNEST(r.transactions) tr
                 WHERE tr.kind = 'refund' AND tr.status = 'success' AND tr.currency = 'EUR'),
               wo.email, wo.id
        FROM raw_shopify.refunds r
        JOIN web_orders wo ON wo.id = r.order_id
      )
      -- Chaque champ : SELECT <champs> FROM events
schema:
  - name: sales_events
    physicalName: sales_events
    physicalType: table
    description: Une ligne par vente ou retour.
    dataGranularityDescription: Une ligne par vente ou retour.
    customProperties:
      - property: loadStrategy
        value: full_refresh
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table n'est jamais vide après un calcul.
      - type: sql
        query: SELECT COUNT(*) FROM (SELECT event_id FROM ${table} GROUP BY event_id HAVING COUNT(*) > 1)
        mustBe: 0
        dimension: uniqueness
        severity: error
        description: La clé primaire (event_id) est unique.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE event_id IS NULL
        mustBe: 0
        dimension: completeness
        severity: error
        description: La clé primaire (event_id) n'est jamais nulle.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE event_type = 'return' AND amount_eur > 0
        mustBe: 0
        dimension: consistency
        severity: error
        description: Un retour n'a jamais un montant positif.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE event_type = 'sale' AND amount_eur < 0
        mustBe: 0
        dimension: consistency
        severity: error
        description: Une vente n'a jamais un montant négatif.
    properties:
      - name: event_id
        physicalType: STRING
        logicalType: string
        description: 'Identifiant de la vente ou du retour : préfixe pos:, web: ou refund: suivi de l''identifiant source.'
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_id
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: Préfixe selon l'origine, suivi de l'identifiant source.
        customProperties:
          - property: transformExpression
            value: event_id
      - name: source_system
        physicalType: STRING
        logicalType: string
        description: 'Système qui a enregistré l''événement : shopify ou pos (caisse).'
        required: true
        classification: C1
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - shopify
                - pos
            mustBe: 0
            dimension: conformity
            severity: error
            description: 'Valeurs autorisées : shopify, pos.'
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_id
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: pos pour un ticket, shopify pour une commande ou un remboursement.
        customProperties:
          - property: transformExpression
            value: source_system
      - name: event_type
        physicalType: STRING
        logicalType: string
        description: Vente (sale) ou retour (return).
        required: true
        classification: C1
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - sale
                - return
            mustBe: 0
            dimension: conformity
            severity: error
            description: 'Valeurs autorisées : sale, return.'
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_type
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.id
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: Type du ticket ; une commande est une vente, un remboursement un retour.
        customProperties:
          - property: transformExpression
            value: event_type
      - name: channel
        physicalType: STRING
        logicalType: string
        description: 'Canal de la vente : store (magasin) ou web. Un ticket lié à une commande web est compté en web.'
        required: true
        classification: C1
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - store
                - web
            mustBe: 0
            dimension: conformity
            severity: error
            description: 'Valeurs autorisées : store, web.'
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.id
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: web si commande, remboursement ou ticket lié à une commande web ; sinon store.
        customProperties:
          - property: transformExpression
            value: channel
      - name: store_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant du magasin ; vide pour le web.
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.currency
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: Magasin du ticket, vide pour le canal web.
        customProperties:
          - property: transformExpression
            value: store_id
      - name: store_code
        physicalType: STRING
        logicalType: string
        description: Code du magasin ; WEB pour le web.
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__stores__pos#stores.store_code
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: Code du magasin du ticket, WEB pour le canal web.
        customProperties:
          - property: transformExpression
            value: store_code
      - name: event_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de l'événement, en UTC.
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__stores__pos#stores.timezone
          - raw__orders__shopify#orders.created_at
          - raw__refunds__shopify#refunds.created_at
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: Heure locale du magasin convertie en UTC ; date de création pour le web.
        customProperties:
          - property: transformExpression
            value: event_at
      - name: event_date
        physicalType: DATE
        logicalType: date
        description: 'Date de l''événement : date locale du magasin, Europe/Paris pour le web.'
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__orders__shopify#orders.created_at
          - raw__refunds__shopify#refunds.created_at
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: Date locale du magasin ou date à Paris pour le web.
        customProperties:
          - property: transformExpression
            value: event_date
      - name: amount_eur
        physicalType: NUMERIC
        logicalType: number
        description: Montant TTC en euros, négatif pour un retour.
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.total_amount_cents
          - raw__orders__shopify#orders.total_price
          - raw__refunds__shopify#refunds.transactions.amount
          - raw__refunds__shopify#refunds.transactions.kind
          - raw__refunds__shopify#refunds.transactions.status
          - raw__refunds__shopify#refunds.transactions.currency
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: Centimes du ticket divisés par 100, total de la commande, ou somme négative des remboursements réussis.
        customProperties:
          - property: transformExpression
            value: amount_eur
      - name: customer_key
        physicalType: STRING
        logicalType: string
        description: Clé client pseudonymisée ; vide si la vente est anonyme.
        classification: C2
        tags:
          - pseudonymized
        transformLogic: transform
        transformSourceObjects:
          - raw__loyalty_members__pos#loyalty_members.email
          - raw__loyalty_members__pos#loyalty_members.loyalty_card_id
          - raw__orders__shopify#orders.email
          - raw__customers__shopify#customers.email
          - raw__tickets__pos#tickets.loyalty_card_id
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__stores__pos#stores.store_id
          - raw__refunds__shopify#refunds.order_id
          - raw__orders__shopify#orders.id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: Hachage de l'e-mail fidélité, sinon de l'e-mail de la commande web d'origine.
        customProperties:
          - property: transformExpression
            value: IF(NULLIF(TRIM(email), '') IS NULL, NULL, TO_HEX(SHA256(LOWER(TRIM(email)))))
      - name: web_order_id
        physicalType: INT64
        logicalType: integer
        description: Commande Shopify liée ; vide pour une vente magasin sans lien web.
        classification: C2
        tags:
          - pseudonymized
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.order_id
          - raw__tickets__pos#tickets.ticket_id
          - raw__tickets__pos#tickets.store_id
          - raw__tickets__pos#tickets.currency
          - raw__stores__pos#stores.store_id
          - raw__orders__shopify#orders.customer_id
          - raw__orders__shopify#orders.test
          - raw__orders__shopify#orders.cancelled_at
          - raw__orders__shopify#orders.currency
          - raw__orders__shopify#orders.source_name
          - raw__orders__shopify#orders.financial_status
          - raw__customers__shopify#customers.id
        transformDescription: Commande de la vente, du remboursement ou d'origine du ticket.
        customProperties:
          - property: transformExpression
            value: web_order_id
      - name: meta_computed_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure du calcul de la ligne, en UTC.
        required: true
        classification: C1
        transformLogic: create
        transformDescription: Horodatage ajouté au calcul.
        customProperties:
          - property: transformExpression
            value: CURRENT_TIMESTAMP()
