apiVersion: v3.2.0
kind: DataContract
id: core__sales_events
name: core__sales_events
version: 1.1.0
status: active
domain: core
tags:
  - core
description:
  purpose: Toutes les ventes et tous les retours, magasin et web, dans une seule table. Les règles de commande valide, de remboursement et de non double comptage sont écrites ici, et nulle part ailleurs.
  usage: Source unique des ventes pour les indicateurs, les audiences et l'acquisition. Filtrer source_system = 'shopify' pour ne garder que Shopify.
  limitations: EUR et TTC uniquement. Environ 50 % des tickets sans carte restent anonymes.
servers:
  - server: bigquery_prod
    type: bigquery
    environment: prod
    description: Dataset BigQuery de la couche core.
    project: retail-data-prod
    dataset: core
team:
  name: team-core
  description: Equipe propriétaire de la couche core.
  members:
    - username: '@org/team-core'
      role: owner
support:
  - channel: data-core
    tool: email
    scope: issues
    url: mailto:data-core@retail.example
    description: Questions et incidents sur la couche core.
slaProperties:
  - property: frequency
    value: 1
    unit: d
    element: sales_events
    driver: analytics
    description: Un recalcul complet par jour.
  - property: latency
    value: 12
    unit: h
    element: sales_events.meta_computed_at
    driver: analytics
    description: Données disponibles au plus tard 12 h après la fin du jour, comme la source la plus lente.
  - property: retention
    value: 3
    unit: y
    element: sales_events
    description: Historique conservé 3 ans.
schema:
  - name: sales_events
    physicalName: sales_events
    physicalType: table
    description: Une ligne par vente ou retour.
    dataGranularityDescription: Une ligne par vente ou retour.
    customProperties:
      - property: loadStrategy
        value: full_refresh
    quality:
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        severity: error
        description: La table n'est jamais vide après un calcul.
      - type: sql
        query: SELECT COUNT(*) FROM (SELECT event_id FROM ${table} GROUP BY event_id HAVING COUNT(*) > 1)
        mustBe: 0
        dimension: uniqueness
        severity: error
        description: La clé primaire (event_id) est unique.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE event_id IS NULL
        mustBe: 0
        dimension: completeness
        severity: error
        description: La clé primaire (event_id) n'est jamais nulle.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE event_type = 'return' AND amount_eur > 0
        mustBe: 0
        dimension: consistency
        severity: error
        description: Un retour n'a jamais un montant positif.
      - type: sql
        query: SELECT COUNT(*) FROM ${table} WHERE event_type = 'sale' AND amount_eur < 0
        mustBe: 0
        dimension: consistency
        severity: error
        description: Une vente n'a jamais un montant négatif.
    properties:
      - name: event_id
        physicalType: STRING
        logicalType: string
        description: 'Identifiant de la vente ou du retour : préfixe pos:, web: ou refund: suivi de l''identifiant source.'
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_id
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.id
        transformDescription: >-
          Préfixe pos, web ou refund, suivi de l'identifiant source. Seules les commandes web valides sont
          retenues (hors test, annulées, caisse, payées en euros), ainsi que les tickets en euros ; un retour
          en caisse déjà remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: event_id
      - name: source_system
        physicalType: STRING
        logicalType: string
        description: 'Système qui a enregistré l''événement : shopify ou pos (caisse).'
        required: true
        classification: C1
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - shopify
                - pos
            mustBe: 0
            dimension: conformity
            severity: error
            description: 'Valeurs autorisées : shopify, pos.'
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_id
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.id
        transformDescription: >-
          pos pour un ticket, shopify pour une commande ou un remboursement. Seules les commandes web valides
          sont retenues (hors test, annulées, caisse, payées en euros), ainsi que les tickets en euros ; un
          retour en caisse déjà remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: source_system
      - name: event_type
        physicalType: STRING
        logicalType: string
        description: Vente (sale) ou retour (return).
        required: true
        classification: C1
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - sale
                - return
            mustBe: 0
            dimension: conformity
            severity: error
            description: 'Valeurs autorisées : sale, return.'
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_type
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.id
        transformDescription: >-
          Type du ticket ; une commande est une vente, un remboursement un retour. Seules les commandes web
          valides sont retenues (hors test, annulées, caisse, payées en euros), ainsi que les tickets en euros
          ; un retour en caisse déjà remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: event_type
      - name: channel
        physicalType: STRING
        logicalType: string
        description: 'Canal de la vente : store (magasin) ou web. Un ticket lié à une commande web est compté en web.'
        required: true
        classification: C1
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - store
                - web
            mustBe: 0
            dimension: conformity
            severity: error
            description: 'Valeurs autorisées : store, web.'
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.id
        transformDescription: >-
          web pour une commande, un remboursement ou un ticket lié à une commande web ; sinon store. Seules
          les commandes web valides sont retenues (hors test, annulées, caisse, payées en euros), ainsi que
          les tickets en euros ; un retour en caisse déjà remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: channel
      - name: store_id
        physicalType: INT64
        logicalType: integer
        description: Identifiant du magasin ; vide pour le web.
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.store_id
        transformDescription: >-
          Magasin du ticket, vide pour le canal web. Seules les commandes web valides sont retenues (hors
          test, annulées, caisse, payées en euros), ainsi que les tickets en euros ; un retour en caisse déjà
          remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: store_id
      - name: store_code
        physicalType: STRING
        logicalType: string
        description: Code du magasin ; WEB pour le web.
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__stores__pos#stores.store_code
        transformDescription: >-
          Code du magasin du ticket (rapproché par l'identifiant de magasin), WEB pour le canal web. Seules
          les commandes web valides sont retenues (hors test, annulées, caisse, payées en euros), ainsi que
          les tickets en euros ; un retour en caisse déjà remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: store_code
      - name: event_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure de l'événement, en UTC.
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__stores__pos#stores.timezone
          - raw__orders__shopify#orders.created_at
          - raw__refunds__shopify#refunds.created_at
        transformDescription: >-
          Heure locale du ticket convertie en UTC avec le fuseau du magasin ; date de création pour le web.
          Seules les commandes web valides sont retenues (hors test, annulées, caisse, payées en euros), ainsi
          que les tickets en euros ; un retour en caisse déjà remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: event_at
      - name: event_date
        physicalType: DATE
        logicalType: date
        description: 'Date de l''événement : date locale du magasin, Europe/Paris pour le web.'
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.ticket_datetime_local
          - raw__orders__shopify#orders.created_at
          - raw__refunds__shopify#refunds.created_at
        transformDescription: >-
          Date locale du ticket, ou date de création à Paris pour le web. Seules les commandes web valides
          sont retenues (hors test, annulées, caisse, payées en euros), ainsi que les tickets en euros ; un
          retour en caisse déjà remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: event_date
      - name: amount_eur
        physicalType: NUMERIC
        logicalType: number
        description: Montant TTC en euros, négatif pour un retour.
        required: true
        classification: C1
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.total_amount_cents
          - raw__orders__shopify#orders.total_price
          - raw__refunds__shopify#refunds.transactions.amount
        transformDescription: >-
          Centimes du ticket divisés par 100, total de la commande, ou somme négative des remboursements
          réussis en euros. Seules les commandes web valides sont retenues (hors test, annulées, caisse,
          payées en euros), ainsi que les tickets en euros ; un retour en caisse déjà remboursé sur Shopify
          est écarté.
        customProperties:
          - property: transformExpression
            value: amount_eur
      - name: currency
        physicalType: STRING
        logicalType: string
        description: 'Code devise ISO 4217 du montant : seules les lignes en euros sont retenues.'
        required: true
        classification: C1
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - EUR
            mustBe: 0
            dimension: conformity
            severity: error
            description: 'Valeur autorisée : EUR.'
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.currency
          - raw__orders__shopify#orders.currency
          - raw__refunds__shopify#refunds.transactions.currency
        transformDescription: >-
          Devise du ticket, de la commande ou du remboursement, filtrée sur EUR. Seules les commandes web
          valides sont retenues (hors test, annulées, caisse, payées en euros), ainsi que les tickets en euros
          ; un retour en caisse déjà remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: currency
      - name: customer_key
        physicalType: STRING
        logicalType: string
        description: Clé client pseudonymisée ; vide si la vente est anonyme.
        classification: C2
        tags:
          - pseudonymized
        transformLogic: transform
        transformSourceObjects:
          - raw__loyalty_members__pos#loyalty_members.email
          - raw__orders__shopify#orders.email
          - raw__customers__shopify#customers.email
        transformDescription: >-
          Hachage de l'e-mail fidélité (retrouvé par la carte), sinon de l'e-mail de la commande web
          d'origine, à défaut celui du client Shopify. Seules les commandes web valides sont retenues (hors
          test, annulées, caisse, payées en euros), ainsi que les tickets en euros ; un retour en caisse déjà
          remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: IF(NULLIF(TRIM(email), '') IS NULL, NULL, TO_HEX(SHA256(LOWER(TRIM(email)))))
      - name: web_order_id
        physicalType: INT64
        logicalType: integer
        description: Commande Shopify liée ; vide pour une vente magasin sans lien web.
        classification: C2
        tags:
          - pseudonymized
        transformLogic: transform
        transformSourceObjects:
          - raw__tickets__pos#tickets.original_web_order_id
          - raw__orders__shopify#orders.id
          - raw__refunds__shopify#refunds.order_id
        transformDescription: >-
          Commande de la vente, du remboursement, ou commande d'origine du ticket. Seules les commandes web
          valides sont retenues (hors test, annulées, caisse, payées en euros), ainsi que les tickets en euros
          ; un retour en caisse déjà remboursé sur Shopify est écarté.
        customProperties:
          - property: transformExpression
            value: web_order_id
      - name: meta_computed_at
        physicalType: TIMESTAMP
        logicalType: timestamp
        description: Date et heure du calcul de la ligne, en UTC.
        required: true
        classification: C1
        transformLogic: create
        transformDescription: Horodatage ajouté au calcul.
        customProperties:
          - property: transformExpression
            value: CURRENT_TIMESTAMP()
