name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dépendances
        run: python -m pip install -e .
      - name: Valider les contrats (schéma, lineage, tests)
        run: make check

  catalog:
    # Catalogue de données (dashboard statique) téléchargeable depuis la PR. Aucune publication externe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dépendances du catalogue
        run: python -m pip install -e ".[catalog]"
      - name: Générer le catalogue
        run: python tools/build_catalog.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue
          path: dist/catalog/
