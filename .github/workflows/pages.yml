name: pages

# À chaque push sur main : publie le catalogue sur Cloudflare Pages (demo-odcs.camillelebrun.fr)
# si le secret CLOUDFLARE_API_TOKEN existe, et sur GitHub Pages (miroir).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets du dépôt. Sans CLOUDFLARE_API_TOKEN, le déploiement Cloudflare est simplement ignoré.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dépendances du catalogue
        run: python -m pip install -e ".[catalog]"
      - name: Contrôler les contrats avant publication
        run: make check
      - name: Générer le catalogue
        run: python tools/build_catalog.py
      - name: Déployer sur Cloudflare Pages (demo-odcs.camillelebrun.fr)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy dist/catalog --project-name demo-odcs --branch main --commit-message "${GITHUB_SHA}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/catalog

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
