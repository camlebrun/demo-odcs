name: pages

# Publie le catalogue de données sur GitHub Pages à chaque push sur main.
# Domaine personnalisé : réglage du dépôt (Settings > Pages), pas un fichier CNAME.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dépendances du catalogue
        run: python -m pip install -e ".[catalog]"
      - name: Contrôler les contrats avant publication
        run: make check
      - name: Générer le catalogue
        run: python tools/build_catalog.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/catalog

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
