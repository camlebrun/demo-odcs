[project]
name = "data-contracts"
version = "0.1.0"
description = "Data contracts ODCS v3.2.0 du data mesh (lot 1) et outillage de validation"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "pytest>=8.0",
]

[project.optional-dependencies]
# Catalogue : dashboard statique dbt-colibri (MIT). Version epinglee, utilisee comme moteur de rendu.
catalog = ["dbt-colibri==0.3.6"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
