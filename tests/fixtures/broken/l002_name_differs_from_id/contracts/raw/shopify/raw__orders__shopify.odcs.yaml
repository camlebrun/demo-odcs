apiVersion: v3.2.0
kind: DataContract
id: raw__orders__shopify
name: orders
version: 1.0.0
status: active
domain: shopify
description:
  purpose: Contrat de test raw__orders__shopify.
servers:
- server: bigquery_prod
  type: bigquery
  environment: prod
  project: retail-data-prod
  dataset: raw_shopify
team:
  name: team-shopify
  members:
  - username: '@org/team-shopify'
    role: owner
support:
- channel: data-shopify
  tool: email
  url: mailto:data-shopify@retail.example
schema:
- name: orders
  physicalType: table
  description: Commandes.
  properties:
