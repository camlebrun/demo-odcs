    classification: internal
    primaryKey: true
    required: true
  - name: email
    physicalType: STRING
    logicalType: string
    description: Champ email.
    classification: restricted
    tags:
    - pii
  - name: total_price
    physicalType: NUMERIC
    logicalType: number
    description: Champ total_price.
    classification: internal
  - name: created_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Champ created_at.
    classification: internal
  - name: meta_loaded_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Champ meta_loaded_at.
    classification: internal
    transformLogic: create
    transformDescription: Horodatage de chargement.
  - name: meta_source_file
    physicalType: STRING
    logicalType: string
    description: Champ meta_source_file.
    classification: internal
    transformLogic: create
    transformDescription: Fichier de depot.
