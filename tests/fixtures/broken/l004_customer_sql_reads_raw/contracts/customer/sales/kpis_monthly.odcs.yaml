apiVersion: v3.2.0
kind: DataContract
id: kpis_monthly
name: kpis_monthly
version: 1.0.0
status: active
domain: customer
description:
  purpose: Contrat de test kpis_monthly.
servers:
- server: bigquery_prod
  type: bigquery
  environment: prod
  project: retail-data-prod
  dataset: customer
team:
  name: team-customer
  members:
  - username: '@org/team-customer'
    role: owner
support:
- channel: data-customer
  tool: email
  url: mailto:data-customer@retail.example
schema:
- name: customer_kpis
  physicalType: table
  description: Indicateurs client.
  properties:
  - name: customer_key
    physicalType: STRING
    logicalType: string
    description: Champ customer_key.
    classification: C2
    transformLogic: transform
    transformDescription: Alimente customer_key.
    tags:
    - pseudonymized
    transformSourceObjects:
    - core__orders#orders.customer_key
    customProperties:
    - property: transformExpression
      value: customer_key
  - name: order_total
    physicalType: NUMERIC
    logicalType: number
    description: Champ order_total.
    classification: C1
    transformLogic: map
    transformDescription: Alimente order_total.
    transformSourceObjects:
    - core__orders#orders.total_price
    customProperties:
    - property: transformExpression
      value: total_price
  - name: first_order_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Champ first_order_at.
    classification: C1
    transformLogic: transform
    transformDescription: Alimente first_order_at.
    transformSourceObjects:
    - core__orders#orders.created_at
    customProperties:
    - property: transformExpression
      value: MIN(created_at)
  - name: last_param_key
    physicalType: STRING
    logicalType: string
    description: Champ last_param_key.
    classification: C1
    transformLogic: transform
    transformDescription: Alimente last_param_key.
    transformSourceObjects:
    - core__events#events.event_params.key
    customProperties:
    - property: transformExpression
      value: MAX(key)
  - name: computed_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Champ computed_at.
    classification: C1
    transformLogic: create
    transformDescription: Alimente computed_at.
    customProperties:
    - property: transformExpression
      value: CURRENT_TIMESTAMP()
customProperties:
- property: transformInputs
  value: SELECT * FROM raw_shopify.orders
