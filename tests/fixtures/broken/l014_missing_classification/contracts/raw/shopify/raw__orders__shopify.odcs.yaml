apiVersion: v3.2.0
kind: DataContract
id: raw__orders__shopify
name: raw__orders__shopify
version: 1.0.0
status: active
domain: shopify
description:
  purpose: Contrat de test raw__orders__shopify.
servers:
- server: bigquery_prod
  type: bigquery
  environment: prod
  project: retail-data-prod
  dataset: raw_shopify
team:
  name: team-shopify
  members:
  - username: '@org/team-shopify'
    role: owner
support:
- channel: data-shopify
  tool: email
  url: mailto:data-shopify@retail.example
schema:
- name: orders
  physicalType: table
  description: Commandes.
  properties:
  - name: id
    physicalType: INT64
    logicalType: integer
    description: Champ id.
    classification: C1
    primaryKey: true
    required: true
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Order.id
    transformDescription: Recopie du champ id de l'objet Order de l'API Admin Shopify, sans transformation.
  - name: email
    physicalType: STRING
    logicalType: string
    description: Champ email.
    classification: C3
    tags:
    - pii
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Order.email
    transformDescription: Recopie du champ email de l'objet Order de l'API Admin Shopify, sans transformation.
  - name: total_price
    physicalType: NUMERIC
    logicalType: number
    description: Champ total_price.
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Order.total_price
    transformDescription: Recopie du champ total_price de l'objet Order de l'API Admin Shopify, sans transformation.
  - name: created_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Champ created_at.
    classification: C1
    transformLogic: map
    transformSourceObjects:
    - shopify_admin_api#Order.created_at
    transformDescription: Recopie du champ created_at de l'objet Order de l'API Admin Shopify, sans transformation.
  - name: meta_loaded_at
    physicalType: TIMESTAMP
    logicalType: timestamp
    description: Champ meta_loaded_at.
    classification: C1
    transformLogic: create
    transformDescription: Horodatage de chargement de la ligne dans BigQuery, renseigne par l'ingestion (aucune source).
  - name: meta_source_file
    physicalType: STRING
    logicalType: string
    description: Champ meta_source_file.
    classification: C1
    transformLogic: create
    transformDescription: URI du fichier de depot d'origine, renseignee par l'ingestion (aucune source).
